<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>포오 PHS 출하 시연</title><link rel="stylesheet" href="../prototype.css"><style>
body{max-width:1024px;margin:auto;padding:clamp(12px,3vw,32px)}header p{color:var(--muted);margin:5px 0 14px}header h1{font-size:clamp(24px,4vw,38px)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,2vw,18px)}.pair .reveal{min-height:0}.pair .reveal-head,.pair .draw-count,.pair .draw-next,.pair .seal-action{display:none}.pair .theatre{padding:16px 4px;min-height:180px}.pair .card-stage{width:min(90%,240px)}.pair .draw-caption{padding:6px 8px}.pair .draw-caption h2{font-size:clamp(17px,3vw,27px)}.pair .draw-rank{font-size:clamp(12px,2vw,16px)}.lot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.lot img{width:72px;height:92px;object-fit:contain}.lot li{display:grid;justify-items:center;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px}
</style></head><body><header><h1>포오 PHS 출하 시연</h1><p>마지막 장에 포오 PHS가 등장하는 고정 10연입니다. 스크랩 소모 없이 감상할 수 있습니다.</p></header>
<div class="toolbar"><button id="compare">두 연출 같이 재생</button><button id="ten">PHS 10연 처음부터 보기</button><button id="last-two" class="primary">9번째부터 다시 보기</button><button id="sound" aria-pressed="false">소리 켜기</button></div>
<label id="choice">비교 카드 <select id="ordinary"><option value="poo-270C">포오 CQ · ★2</option><option value="ssial-1470M">씨알 1470M · ★5</option></select></label>
<main id="screen" aria-label="출하 시연"></main><script type="module" src="preview.mjs"></script></body></html>
