<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Grade Gacha · MODIFY SANDBOX</title><style>html,body,#game{width:100%;height:100%;margin:0;border:0;background:#111}body{overflow:hidden}#badge{position:fixed;z-index:9;right:8px;top:8px;padding:6px 9px;border-radius:999px;background:#111d;color:#fff;font:700 11px system-ui;pointer-events:none}</style></head><body><div id="badge">MODIFY · SANDBOX</div><iframe id="game" src="index.html"></iframe><script>const f=document.getElementById('game'),badge=document.getElementById('badge');f.onload=()=>{let initialized=false;const apply=()=>{try{const w=f.contentWindow;if(!w||!w.S)return setTimeout(apply,100);const chars=typeof w.allChars==='function'?w.allChars():(w.POOL||[]);const ids=chars.map(x=>typeof x==='string'?x:(x.id||x.key)).filter(Boolean);w.S.owned=w.S.owned||{};ids.forEach(id=>w.S.owned[id]=true);w.S.stock=w.S.stock||{};ids.forEach(id=>w.S.stock[id]=Math.max(Number(w.S.stock[id])||0,99));if(w.ITEMS){w.S.items=w.S.items||{};w.ITEMS.forEach(it=>{const k=it.key||it.id;if(k&&!w.S.items[k])w.S.items[k]=1})}['scrap','scraps'].forEach(k=>{if(typeof w.S[k]==='number')w.S[k]=Math.max(w.S[k],999)});/* IMPORTANT: S.parts is a completion map, not a quantity inventory. Do not fill it here. Filling every PARTS key makes carDone() true and renderCar() repeatedly redraws the vehicle picker, which removes the selected vehicle's take button. */w.S.parts=w.S.parts||{};w.S.cars=Array.isArray(w.S.cars)?w.S.cars:[];w.loadFailed=false;w.saveHold=false;if(typeof w.save==='function')w.save();if(!initialized&&typeof w.refresh==='function'){initialized=true;w.refresh()}badge.textContent='MODIFY · '+ids.length+' GRADES · STOCK 99 · VEHICLE TEST';setTimeout(apply,1500)}catch(e){console.error(e);setTimeout(apply,500)}};setTimeout(apply,700)};</script></body></html>
