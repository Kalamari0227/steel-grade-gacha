<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Grade Gacha · MODIFY ALL OPEN</title><style>html,body,#game{width:100%;height:100%;margin:0;border:0;background:#111}body{overflow:hidden}#badge{position:fixed;z-index:9;right:8px;top:8px;padding:6px 9px;border-radius:999px;background:#111d;color:#fff;font:700 11px system-ui;pointer-events:none}</style></head><body><div id="badge">MODIFY · ALL OPEN</div><iframe id="game" src="index.html"></iframe><script>const f=document.getElementById('game'),badge=document.getElementById('badge');f.onload=()=>{const apply=()=>{try{const w=f.contentWindow;if(!w||!w.S)return setTimeout(apply,100);const chars=typeof w.allChars==='function'?w.allChars():(w.POOL||[]);const ids=chars.map(x=>typeof x==='string'?x:(x.id||x.key)).filter(Boolean);w.S.owned=w.S.owned||{};ids.forEach(id=>w.S.owned[id]=true);const stockKey=['stock','inventory','warehouse','counts'].find(k=>w.S[k]&&typeof w.S[k]==='object');if(stockKey)ids.forEach(id=>w.S[stockKey][id]=Math.max(Number(w.S[stockKey][id])||0,99));if(w.ITEMS){w.S.items=w.S.items||{};w.ITEMS.forEach(it=>{const k=it.key||it.id;if(k&&!w.S.items[k])w.S.items[k]=1})}['scrap','scraps'].forEach(k=>{if(typeof w.S[k]==='number')w.S[k]=999});const defs=[];['PARTS','CAR_PARTS','AUTO_PARTS','VEHICLE_PARTS','ASSEMBLY_PARTS'].forEach(k=>{if(Array.isArray(w[k]))defs.push(...w[k])});const partIds=[...new Set(defs.map(x=>typeof x==='string'?x:(x.id||x.key||x.code)).filter(Boolean))];const partStores=['parts','partStock','partInventory','components','builtParts'];partStores.forEach(k=>{if(w.S[k]&&typeof w.S[k]==='object'&&!Array.isArray(w.S[k]))partIds.forEach(id=>w.S[k][id]=Math.max(Number(w.S[k][id])||0,99))});if(!partIds.length){partStores.forEach(k=>{if(w.S[k]&&typeof w.S[k]==='object'&&!Array.isArray(w.S[k]))Object.keys(w.S[k]).forEach(id=>{if(typeof w.S[k][id]==='number')w.S[k][id]=Math.max(w.S[k][id],99)})})}const carDefs=[];['CARS','VEHICLES','CAR_MODELS','VEHICLE_MODELS'].forEach(k=>{if(Array.isArray(w[k]))carDefs.push(...w[k])});const carIds=[...new Set(carDefs.map(x=>typeof x==='string'?x:(x.id||x.key||x.code)).filter(Boolean))];['cars','vehicles','carOwned','vehicleOwned','completedCars'].forEach(k=>{if(w.S[k]&&typeof w.S[k]==='object'&&!Array.isArray(w.S[k])){carIds.forEach(id=>{const v=w.S[k][id];w.S[k][id]=typeof v==='number'?Math.max(v,1):true});Object.keys(w.S[k]).forEach(id=>{const v=w.S[k][id];if(typeof v==='boolean')w.S[k][id]=true})}});['carLevel','vehicleLevel','assemblyLevel','factoryLevel'].forEach(k=>{if(typeof w.S[k]==='number')w.S[k]=Math.max(w.S[k],99)});w.loadFailed=false;w.saveHold=false;if(typeof w.save==='function')w.save();if(typeof w.refresh==='function')w.refresh();badge.textContent='MODIFY · ALL '+ids.length+' OPEN'+(stockKey?' · STOCK 99':'')+(partIds.length?' · PARTS 99':'')+(carIds.length?' · CARS OPEN':'');setTimeout(apply,1500)}catch(e){console.error(e);setTimeout(apply,500)}};setTimeout(apply,700)};</script></body></html>
