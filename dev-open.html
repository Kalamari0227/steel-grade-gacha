<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Grade Gacha · MODIFY ALL OPEN</title><style>html,body,#game{width:100%;height:100%;margin:0;border:0;background:#111}body{overflow:hidden}#badge{position:fixed;z-index:9;right:8px;top:8px;padding:5px 8px;border-radius:999px;background:#111c;color:#fff;font:700 11px system-ui;pointer-events:none}</style></head><body><div id="badge">MODIFY · ALL OPEN</div><iframe id="game" src="index.html"></iframe><script>const f=document.getElementById('game');f.onload=()=>{try{const w=f.contentWindow;const apply=()=>{if(!w.POOL||!w.S||!w.ITEMS)return setTimeout(apply,50);w.POOL.forEach(id=>w.S.owned[id]=true);w.ITEMS.forEach(it=>{if(!w.S.items[it.key])w.S.items[it.key]=1});w.loadFailed=false;w.saveHold=false;if(w.save)w.save();if(w.refresh)w.refresh();};apply();}catch(e){console.error(e)}};</script></body></html>
