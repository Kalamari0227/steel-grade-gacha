<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STEEL DRIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#18212b;color:#eef4f8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}#wrap{width:min(100vw,460px);height:100dvh;margin:auto;position:relative;background:#25323d}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #000;font-weight:900;font-size:13px}.tag{color:#ffd66b}.panel{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#13202bee;border:3px solid #d8e2e8;padding:18px;text-align:center;box-shadow:7px 7px #071018}.panel h1{margin:0 0 8px;font-size:25px;color:#ffd66b}.panel p{font:13px/1.6 system-ui,sans-serif;color:#d5dee5}.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.carbtn{border:2px solid #718391;background:#253744;color:white;padding:9px 3px;font:800 11px ui-monospace;min-height:54px}.carbtn.on{border-color:#ffd66b;background:#41515d}.go{width:100%;border:0;background:#ffd66b;color:#17212a;padding:13px;font-weight:1000;font-size:15px}.small{font-size:10px!important;color:#91a1ad!important}.hidden{display:none}.back{position:absolute;left:12px;bottom:12px;border:1px solid #8393a0;background:#18232dcc;color:#fff;padding:8px 10px;font:700 11px ui-monospace}
</style></head><body><div id="wrap"><canvas id="c"></canvas><div class="hud"><span><span class="tag">STEEL DRIVE</span><br><span id="carName">GARAGE</span></span><span style="text-align:right">DIST <span id="dist">0000</span>m<br>BEST <span id="best">0000</span>m</span></div><div id="menu" class="panel"><h1>STEEL DRIVE</h1><p>완성한 차를 골라 도로로 나가자.<br>좌우 드래그 또는 ← → 키로 회피!</p><div id="cars" class="cars"></div><button id="go" class="go">DRIVE!</button><p class="small">MODIFY PROTOTYPE · 차량 데이터는 본편 저장상태를 읽습니다.</p></div><button class="back" onclick="location.href='index.html'">← GARAGE</button></div><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d'),menu=document.querySelector('#menu'),carsEl=document.querySelector('#cars'),go=document.querySelector('#go');let W,H,dpr,playing=false,dead=false,last=0,dist=0,speed=280,px=0,py=0,vx=0,obs=[],selected=0,roadOff=0;
const FALLBACK=['CAR 01','CAR 02','CAR 03','CAR 04','CAR 05','CAR 06','CAR 07','CAR 08'];let unlocked=FALLBACK.map((name,i)=>({k:'car'+(i+1),name}));
function loadCars(){try{const raw=localStorage.getItem('steelGradeGacha')||localStorage.getItem('sgg');if(raw){const s=JSON.parse(raw),arr=s.cars||[];if(arr.length) unlocked=arr.map((v,i)=>({k:v.k||('car'+(i+1)),name:String(v.k||('CAR '+String(i+1).padStart(2,'0'))).replace(/[_-]/g,' ').toUpperCase()}));}}catch(e){} renderCars()}
function renderCars(){carsEl.innerHTML='';unlocked.slice(0,8).forEach((v,i)=>{const b=document.createElement('button');b.className='carbtn'+(i===selected?' on':'');b.innerHTML='🚗<br>'+v.name;b.onclick=()=>{selected=i;renderCars()};carsEl.appendChild(b)});go.disabled=!unlocked.length}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);py=H*.78;if(!px)px=W/2}addEventListener('resize',resize);resize();
function reset(){dist=0;speed=280;obs=[];px=W/2;dead=false;playing=true;menu.classList.add('hidden');document.querySelector('#carName').textContent=unlocked[selected]?.name||'STEEL CAR';last=performance.now();requestAnimationFrame(loop)}
go.onclick=reset;
function spawn(){const lanes=[-.31,0,.31],rw=Math.min(W*.78,340),cx=W/2;obs.push({x:cx+lanes[Math.floor(Math.random()*3)]*rw,y:-80,w:38,h:68,t:Math.random()<.22?'truck':'car'})}
function road(){x.fillStyle='#53705a';x.fillRect(0,0,W,H);const rw=Math.min(W*.78,340),l=(W-rw)/2;x.fillStyle='#343a3f';x.fillRect(l,0,rw,H);x.fillStyle='#e8e0bf';x.fillRect(l+5,0,4,H);x.fillRect(l+rw-9,0,4,H);x.fillStyle='#e8e0bf';for(let y=-50+(roadOff%70);y<H;y+=70){x.fillRect(W/2-rw/6-2,y,4,34);x.fillRect(W/2+rw/6-2,y,4,34)}for(let y=-30+(roadOff%110);y<H;y+=110){x.fillStyle='#d5b85b';x.fillRect(l-10,y,6,18);x.fillRect(l+rw+4,y,6,18)}}
function drawCar(cx,cy,w,h,color='#e85b4f'){x.save();x.translate(cx,cy);x.fillStyle='#111';x.fillRect(-w/2-4,-h*.3,5,h*.22);x.fillRect(w/2-1,-h*.3,5,h*.22);x.fillRect(-w/2-4,h*.15,5,h*.22);x.fillRect(w/2-1,h*.15,5,h*.22);x.fillStyle=color;x.fillRect(-w/2,-h/2,w,h);x.fillStyle='#a9d2df';x.fillRect(-w*.34,-h*.25,w*.68,h*.23);x.fillStyle='#243642';x.fillRect(-w*.34,h*.08,w*.68,h*.17);x.fillStyle='#ffe89a';x.fillRect(-w*.35,-h*.47,7,5);x.fillRect(w*.35-7,-h*.47,7,5);x.restore()}
function crash(){dead=true;playing=false;const best=Math.max(+localStorage.getItem('steelDriveBest')||0,Math.floor(dist));localStorage.setItem('steelDriveBest',best);document.querySelector('#best').textContent=String(best).padStart(4,'0');menu.classList.remove('hidden');menu.querySelector('h1').textContent='BODY DAMAGE!';menu.querySelector('p').innerHTML='주행거리 <b>'+Math.floor(dist)+'m</b><br>다른 차로 다시 달려볼까?';go.textContent='RETRY'}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.035);last=t;speed=Math.min(560,speed+dt*4);dist+=dt*speed*.055;roadOff+=dt*speed;if(Math.random()<dt*(.7+speed/500))spawn();px+=vx*dt;const rw=Math.min(W*.78,340);px=Math.max((W-rw)/2+27,Math.min((W+rw)/2-27,px));obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<H+100);road();obs.forEach(o=>drawCar(o.x,o.y,o.w,o.h,o.t==='truck'?'#d8a348':'#7190b0'));drawCar(px,py,42,72,'#e95b4e');for(const o of obs)if(Math.abs(o.x-px)<35&&Math.abs(o.y-py)<60){crash();return}document.querySelector('#dist').textContent=String(Math.floor(dist)).padStart(4,'0');requestAnimationFrame(loop)}
function steer(clientX){if(!playing)return;const r=cv.getBoundingClientRect();px=clientX-r.left}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);steer(e.clientX)});cv.addEventListener('pointermove',e=>{if(e.buttons)steer(e.clientX)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vx=-230;if(e.key==='ArrowRight')vx=230});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))vx=0});document.querySelector('#best').textContent=String(+localStorage.getItem('steelDriveBest')||0).padStart(4,'0');loadCars();
</script></body></html>
