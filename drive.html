<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STEEL DRIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#18212b;color:#eef4f8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}#wrap{width:min(100vw,460px);height:100dvh;margin:auto;position:relative;background:#25323d}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #000;font-weight:900;font-size:13px}.tag{color:#ffd66b}.panel{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#13202bee;border:3px solid #d8e2e8;padding:16px;text-align:center;box-shadow:7px 7px #071018}.panel h1{margin:0 0 6px;font-size:25px;color:#ffd66b}.panel p{font:13px/1.5 system-ui,sans-serif;color:#d5dee5}.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.carbtn{border:2px solid #718391;background:#253744;color:white;padding:4px;font:800 10px ui-monospace;min-height:86px;overflow:hidden}.carbtn img{width:100%;height:54px;object-fit:cover;display:block;margin-bottom:3px;background:#dfe6eb}.carbtn.on{border-color:#ffd66b;background:#41515d}.go{width:100%;border:0;background:#ffd66b;color:#17212a;padding:13px;font-weight:1000;font-size:15px}.go:disabled{opacity:.4}.small{font-size:10px!important;color:#91a1ad!important}.hidden{display:none}.back{position:absolute;left:12px;bottom:12px;border:1px solid #8393a0;background:#18232dcc;color:#fff;padding:8px 10px;font:700 11px ui-monospace}#bridge{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style></head><body><div id="wrap"><canvas id="c"></canvas><div class="hud"><span><span class="tag">STEEL DRIVE</span><br><span id="carName">GARAGE LINK...</span></span><span style="text-align:right">DIST <span id="dist">0000</span>m<br>BEST <span id="best">0000</span>m</span></div><div id="menu" class="panel"><h1>STEEL DRIVE</h1><p id="intro">본편 차고를 불러오는 중...</p><div id="cars" class="cars"></div><button id="go" class="go" disabled>DRIVE!</button><p class="small">NATIVE GARAGE LINK · 본편에서 완성한 차량만 출전합니다.</p></div><button class="back" onclick="location.href='index.html#garage'">← GARAGE</button><iframe id="bridge" src="index.html" aria-hidden="true"></iframe></div><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d'),menu=document.querySelector('#menu'),carsEl=document.querySelector('#cars'),go=document.querySelector('#go'),intro=document.querySelector('#intro'),bridge=document.querySelector('#bridge');let W,H,dpr,playing=false,last=0,dist=0,speed=280,px=0,py=0,vx=0,obs=[],selected=0,roadOff=0,garage=[];
const palette={t:'#b84d48',h:'#477ba4',n:'#cf9b42',m:'#596a78',s:'#497b63',z:'#8a668f',b:'#a85f43',d:'#4d8f9b'};
function connectGarage(){try{const w=bridge.contentWindow;if(!w||!Array.isArray(w.CARS)||!w.S||!Array.isArray(w.S.cars))return setTimeout(connectGarage,120);garage=w.CARS.filter(c=>w.S.cars.some(v=>v.k===c.key)).map(c=>({k:c.key,name:c.tag,body:c.body,img:w.IMG_CAR&&w.IMG_CAR[c.key]}));renderCars();intro.innerHTML=garage.length?'내가 완성한 차를 골라 도로로 나가자.<br>좌우 드래그 또는 ← → 키로 회피!':'아직 완성한 차량이 없습니다.<br>본편에서 자동차를 먼저 완성해 주세요.';document.querySelector('#carName').textContent=garage.length?'GARAGE '+garage.length+'/8':'NO CAR';go.disabled=!garage.length;/* Data and artwork are copied; the hidden game is no longer needed. */setTimeout(()=>bridge.remove(),50)}catch(e){console.error(e);intro.textContent='차고 연결에 실패했습니다.'}}bridge.addEventListener('load',()=>setTimeout(connectGarage,250));
function renderCars(){carsEl.innerHTML='';garage.forEach((v,i)=>{const b=document.createElement('button');b.className='carbtn'+(i===selected?' on':'');const im=v.img?'<img src="'+v.img+'" alt="">':'<div style="height:54px">🚗</div>';b.innerHTML=im+'<span>'+v.name+'</span>';b.title=v.body;b.onclick=()=>{selected=i;renderCars()};carsEl.appendChild(b)})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);py=H*.78;if(!px)px=W/2}addEventListener('resize',resize);resize();
function reset(){if(!garage.length)return;dist=0;speed=280;obs=[];px=W/2;playing=true;menu.classList.add('hidden');const car=garage[selected];document.querySelector('#carName').textContent=car.name+' · '+car.body;last=performance.now();requestAnimationFrame(loop)}go.onclick=reset;
function spawn(){const lanes=[-.31,0,.31],rw=Math.min(W*.78,340),cx=W/2;obs.push({x:cx+lanes[Math.floor(Math.random()*3)]*rw,y:-80,w:38,h:68,t:Math.random()<.22?'truck':'car'})}
function road(){x.fillStyle='#53705a';x.fillRect(0,0,W,H);const rw=Math.min(W*.78,340),l=(W-rw)/2;x.fillStyle='#343a3f';x.fillRect(l,0,rw,H);x.fillStyle='#e8e0bf';x.fillRect(l+5,0,4,H);x.fillRect(l+rw-9,0,4,H);for(let y=-50+(roadOff%70);y<H;y+=70){x.fillRect(W/2-rw/6-2,y,4,34);x.fillRect(W/2+rw/6-2,y,4,34)}for(let y=-30+(roadOff%110);y<H;y+=110){x.fillStyle='#d5b85b';x.fillRect(l-10,y,6,18);x.fillRect(l+rw+4,y,6,18)}}
function drawCar(cx,cy,w,h,color){x.save();x.translate(cx,cy);x.fillStyle='#111';x.fillRect(-w/2-4,-h*.3,5,h*.22);x.fillRect(w/2-1,-h*.3,5,h*.22);x.fillRect(-w/2-4,h*.15,5,h*.22);x.fillRect(w/2-1,h*.15,5,h*.22);x.fillStyle=color;x.fillRect(-w/2,-h/2,w,h);x.fillStyle='#a9d2df';x.fillRect(-w*.34,-h*.25,w*.68,h*.23);x.fillStyle='#243642';x.fillRect(-w*.34,h*.08,w*.68,h*.17);x.fillStyle='#ffe89a';x.fillRect(-w*.35,-h*.47,7,5);x.fillRect(w*.35-7,-h*.47,7,5);x.restore()}
function crash(){playing=false;const best=Math.max(+localStorage.getItem('steelDriveBest')||0,Math.floor(dist));localStorage.setItem('steelDriveBest',best);document.querySelector('#best').textContent=String(best).padStart(4,'0');menu.classList.remove('hidden');menu.querySelector('h1').textContent='BODY DAMAGE!';intro.innerHTML='주행거리 <b>'+Math.floor(dist)+'m</b><br>'+garage[selected].name+'로 다시 달려볼까?';go.textContent='RETRY'}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.035);last=t;speed=Math.min(560,speed+dt*4);dist+=dt*speed*.055;roadOff+=dt*speed;if(Math.random()<dt*(.7+speed/500))spawn();px+=vx*dt;const rw=Math.min(W*.78,340);px=Math.max((W-rw)/2+27,Math.min((W+rw)/2-27,px));obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<H+100);road();obs.forEach(o=>drawCar(o.x,o.y,o.w,o.h,o.t==='truck'?'#d8a348':'#7190b0'));const me=garage[selected];drawCar(px,py,42,72,palette[me.k]||'#e95b4e');for(const o of obs)if(Math.abs(o.x-px)<35&&Math.abs(o.y-py)<60){crash();return}document.querySelector('#dist').textContent=String(Math.floor(dist)).padStart(4,'0');requestAnimationFrame(loop)}
function steer(clientX){if(!playing)return;const r=cv.getBoundingClientRect();px=clientX-r.left}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);steer(e.clientX)});cv.addEventListener('pointermove',e=>{if(e.buttons)steer(e.clientX)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vx=-230;if(e.key==='ArrowRight')vx=230});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))vx=0});document.querySelector('#best').textContent=String(+localStorage.getItem('steelDriveBest')||0).padStart(4,'0');
</script></body></html>
