<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STEEL DRIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#18212b;color:#eef4f8;font-family:ui-monospace,monospace;overflow:hidden}#w{width:min(100vw,460px);height:100dvh;margin:auto;position:relative}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #000;font-weight:900;font-size:13px}.tag{color:#ffd66b}.p{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#13202bee;border:3px solid #d8e2e8;padding:15px;text-align:center;box-shadow:7px 7px #071018}.p h1{margin:0;color:#ffd66b}.p p{font:13px/1.5 system-ui;color:#d5dee5}.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.cb{border:2px solid #718391;background:#253744;color:white;padding:4px;font:800 10px ui-monospace;min-height:86px}.cb img{width:100%;height:54px;object-fit:cover;display:block}.cb.on{border-color:#ffd66b}.go{width:100%;border:0;background:#ffd66b;color:#17212a;padding:13px;font-weight:1000}.hide{display:none}.back{position:absolute;left:12px;bottom:12px;background:#18232dcc;color:white;border:1px solid #8393a0;padding:8px}#bridge{position:absolute;width:1px;height:1px;opacity:0}</style></head><body><div id="w"><canvas id="c"></canvas><div class="hud"><span><span class="tag">STEEL DRIVE</span><br><span id="name">GARAGE LINK...</span></span><span>DIST <span id="dist">0000</span>m<br>BEST <span id="best">0000</span>m</span></div><div id="menu" class="p"><h1>STEEL DRIVE</h1><p id="intro">본편 차고를 불러오는 중...</p><div id="cars" class="cars"></div><button id="go" class="go" disabled>DRIVE!</button><p>완성차별 전용 탑뷰 모델 · 차종 실루엣 연동</p></div><button class="back" onclick="location.href='index.html#garage'">← GARAGE</button><iframe id="bridge" src="index.html"></iframe></div><script>
const cv=c,x=cv.getContext('2d'),bridge=document.querySelector('#bridge'),menu=document.querySelector('#menu'),intro=document.querySelector('#intro'),carsEl=document.querySelector('#cars'),go=document.querySelector('#go');let W,H,dpr,garage=[],selected=0,playing=false,last=0,dist=0,speed=280,px=0,py=0,vx=0,obs=[],roadOff=0;const MODEL={};
function connect(){try{const q=bridge.contentWindow;if(!q||!q.CARS||!q.S||!q.S.cars)return setTimeout(connect,120);garage=q.CARS.filter(a=>q.S.cars.some(v=>v.k===a.key)).map(a=>({k:a.key,name:a.tag,body:a.body,img:q.IMG_CAR&&q.IMG_CAR[a.key]}));render();intro.innerHTML=garage.length?'본편에서 만든 바로 그 차로 출발합니다.<br>차종마다 탑뷰 실루엣이 확실히 다릅니다.':'완성한 차량이 없습니다.';name.textContent=garage.length?'GARAGE '+garage.length+'/8':'NO CAR';go.disabled=!garage.length;setTimeout(()=>bridge.remove(),50)}catch(e){intro.textContent='차고 연결 실패'}}bridge.onload=()=>setTimeout(connect,250);
function render(){carsEl.innerHTML='';garage.forEach((v,i)=>{let b=document.createElement('button');b.className='cb'+(i===selected?' on':'');b.innerHTML=(v.img?'<img src="'+v.img+'">':'🚗')+'<span>'+v.name+'<br>'+v.body+'</span>';b.onclick=()=>{selected=i;render()};carsEl.appendChild(b)})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);py=H*.78;if(!px)px=W/2}resize();addEventListener('resize',resize);
function road(){x.fillStyle='#53705a';x.fillRect(0,0,W,H);let rw=Math.min(W*.78,340),l=(W-rw)/2;x.fillStyle='#343a3f';x.fillRect(l,0,rw,H);x.fillStyle='#e8e0bf';x.fillRect(l+5,0,4,H);x.fillRect(l+rw-9,0,4,H);for(let y=-50+roadOff%70;y<H;y+=70){x.fillRect(W/2-rw/6-2,y,4,34);x.fillRect(W/2+rw/6-2,y,4,34)}}
function npc(o){x.save();x.translate(o.x,o.y);x.fillStyle='#111';x.fillRect(-22,-30,44,64);x.fillStyle=o.t?'#d8a348':'#7190b0';x.fillRect(-19,-34,38,68);x.fillStyle='#a9ccd5';x.fillRect(-13,-19,26,15);x.fillStyle='#263740';x.fillRect(-13,7,26,12);x.restore()}
function spawn(){let lanes=[-.31,0,.31],rw=Math.min(W*.78,340);obs.push({x:W/2+lanes[Math.floor(Math.random()*3)]*rw,y:-80,w:38,h:68,t:Math.random()<.22})}
function start(){if(!garage.length)return;dist=0;speed=280;obs=[];px=W/2;playing=true;menu.classList.add('hide');name.textContent=garage[selected].name+' · '+garage[selected].body;last=performance.now();requestAnimationFrame(loop)}go.onclick=start;
function crash(){playing=false;let b=Math.max(+localStorage.steelDriveBest||0,Math.floor(dist));localStorage.steelDriveBest=b;best.textContent=String(b).padStart(4,'0');menu.classList.remove('hide');menu.querySelector('h1').textContent='BODY DAMAGE!';intro.innerHTML=garage[selected].body+' · '+Math.floor(dist)+'m';go.textContent='RETRY'}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.035);last=t;speed=Math.min(560,speed+dt*4);dist+=dt*speed*.055;roadOff+=dt*speed;if(Math.random()<dt*(.7+speed/500))spawn();px+=vx*dt;let rw=Math.min(W*.78,340);px=Math.max((W-rw)/2+30,Math.min((W+rw)/2-30,px));obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<H+100);road();obs.forEach(npc);let me=garage[selected],m=MODEL[me.k]||{w:44,h:78};playerCar(px,py,me.k);for(let o of obs)if(Math.abs(o.x-px)<(o.w+m.w)*.4&&Math.abs(o.y-py)<(o.h+m.h)*.4){crash();return}document.querySelector('#dist').textContent=String(Math.floor(dist)).padStart(4,'0');requestAnimationFrame(loop)}
function steer(v){if(playing)px=v-cv.getBoundingClientRect().left}cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);steer(e.clientX)};cv.onpointermove=e=>{if(e.buttons)steer(e.clientX)};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vx=-230;if(e.key==='ArrowRight')vx=230});addEventListener('keyup',()=>vx=0);best.textContent=String(+localStorage.steelDriveBest||0).padStart(4,'0');
</script><script src="drive-sprites.js"></script></body></html>
