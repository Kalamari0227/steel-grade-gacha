<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STEEL DRIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#18212b;color:#eef4f8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}#wrap{width:min(100vw,460px);height:100dvh;margin:auto;position:relative;background:#25323d}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #000;font-weight:900;font-size:13px}.tag{color:#ffd66b}.panel{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#13202bee;border:3px solid #d8e2e8;padding:16px;text-align:center;box-shadow:7px 7px #071018}.panel h1{margin:0 0 6px;font-size:25px;color:#ffd66b}.panel p{font:13px/1.5 system-ui,sans-serif;color:#d5dee5}.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.carbtn{border:2px solid #718391;background:#253744;color:white;padding:4px;font:800 10px ui-monospace;min-height:86px;overflow:hidden}.carbtn img{width:100%;height:54px;object-fit:cover;display:block;margin-bottom:3px;background:#dfe6eb}.carbtn.on{border-color:#ffd66b;background:#41515d}.go{width:100%;border:0;background:#ffd66b;color:#17212a;padding:13px;font-weight:1000;font-size:15px}.go:disabled{opacity:.4}.small{font-size:10px!important;color:#91a1ad!important}.hidden{display:none}.back{position:absolute;left:12px;bottom:12px;border:1px solid #8393a0;background:#18232dcc;color:#fff;padding:8px 10px;font:700 11px ui-monospace}#bridge{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head><body><div id="wrap"><canvas id="c"></canvas><div class="hud"><span><span class="tag">STEEL DRIVE</span><br><span id="carName">GARAGE LINK...</span></span><span style="text-align:right">DIST <span id="dist">0000</span>m<br>BEST <span id="best">0000</span>m</span></div><div id="menu" class="panel"><h1>STEEL DRIVE</h1><p id="intro">본편 차고를 불러오는 중...</p><div id="cars" class="cars"></div><button id="go" class="go" disabled>DRIVE!</button><p class="small">NATIVE GARAGE LINK · 완성차별 전용 탑뷰 모델</p></div><button class="back" onclick="location.href='index.html#garage'">← GARAGE</button><iframe id="bridge" src="index.html" aria-hidden="true"></iframe></div><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d'),menu=document.querySelector('#menu'),carsEl=document.querySelector('#cars'),go=document.querySelector('#go'),intro=document.querySelector('#intro'),bridge=document.querySelector('#bridge');let W,H,dpr,playing=false,last=0,dist=0,speed=280,px=0,py=0,vx=0,obs=[],selected=0,roadOff=0,garage=[];
const MODEL={t:{c:'#b84d48',w:48,h:82,roof:.72,nose:.12,kind:'van'},h:{c:'#477ba4',w:43,h:78,roof:.60,nose:.20,kind:'sedan'},n:{c:'#cf9b42',w:44,h:75,roof:.56,nose:.23,kind:'sport'},m:{c:'#596a78',w:46,h:80,roof:.66,nose:.17,kind:'wagon'},s:{c:'#497b63',w:45,h:77,roof:.62,nose:.19,kind:'sedan'},z:{c:'#8a668f',w:47,h:74,roof:.54,nose:.25,kind:'sport'},b:{c:'#a85f43',w:46,h:79,roof:.64,nose:.18,kind:'sedan'},d:{c:'#4d8f9b',w:40,h:68,roof:.43,nose:.22,kind:'roadster'}};
function connectGarage(){try{const w=bridge.contentWindow;if(!w||!Array.isArray(w.CARS)||!w.S||!Array.isArray(w.S.cars))return setTimeout(connectGarage,120);garage=w.CARS.filter(c=>w.S.cars.some(v=>v.k===c.key)).map(c=>({k:c.key,name:c.tag,body:c.body,img:w.IMG_CAR&&w.IMG_CAR[c.key]}));renderCars();intro.innerHTML=garage.length?'내가 완성한 차를 골라 도로로 나가자.<br>차종마다 실제 주행 실루엣도 달라집니다.':'아직 완성한 차량이 없습니다.<br>본편에서 자동차를 먼저 완성해 주세요.';document.querySelector('#carName').textContent=garage.length?'GARAGE '+garage.length+'/8':'NO CAR';go.disabled=!garage.length;setTimeout(()=>bridge.remove(),50)}catch(e){intro.textContent='차고 연결에 실패했습니다.'}}bridge.addEventListener('load',()=>setTimeout(connectGarage,250));
function renderCars(){carsEl.innerHTML='';garage.forEach((v,i)=>{const b=document.createElement('button');b.className='carbtn'+(i===selected?' on':'');b.innerHTML=(v.img?'<img src="'+v.img+'" alt="">':'<div style="height:54px">🚗</div>')+'<span>'+v.name+'</span>';b.title=v.body;b.onclick=()=>{selected=i;renderCars()};carsEl.appendChild(b)})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);py=H*.78;if(!px)px=W/2}addEventListener('resize',resize);resize();function reset(){if(!garage.length)return;dist=0;speed=280;obs=[];px=W/2;playing=true;menu.classList.add('hidden');const car=garage[selected];document.querySelector('#carName').textContent=car.name+' · '+car.body;last=performance.now();requestAnimationFrame(loop)}go.onclick=reset;
function spawn(){const lanes=[-.31,0,.31],rw=Math.min(W*.78,340),cx=W/2;obs.push({x:cx+lanes[Math.floor(Math.random()*3)]*rw,y:-80,w:38,h:68,t:Math.random()<.22?'truck':'car'})}function road(){x.fillStyle='#53705a';x.fillRect(0,0,W,H);const rw=Math.min(W*.78,340),l=(W-rw)/2;x.fillStyle='#343a3f';x.fillRect(l,0,rw,H);x.fillStyle='#e8e0bf';x.fillRect(l+5,0,4,H);x.fillRect(l+rw-9,0,4,H);for(let y=-50+(roadOff%70);y<H;y+=70){x.fillRect(W/2-rw/6-2,y,4,34);x.fillRect(W/2+rw/6-2,y,4,34)}for(let y=-30+(roadOff%110);y<H;y+=110){x.fillStyle='#d5b85b';x.fillRect(l-10,y,6,18);x.fillRect(l+rw+4,y,6,18)}}
function playerCar(cx,cy,key){const m=MODEL[key]||MODEL.h,w=m.w,h=m.h;x.save();x.translate(Math.round(cx),Math.round(cy));x.fillStyle='#12171b';x.fillRect(-w/2-4,-h*.31,6,h*.19);x.fillRect(w/2-2,-h*.31,6,h*.19);x.fillRect(-w/2-4,h*.17,6,h*.19);x.fillRect(w/2-2,h*.17,6,h*.19);x.fillStyle='#0d1418';x.fillRect(-w/2+3,-h/2-2,w-6,h+4);x.fillStyle=m.c;x.fillRect(-w/2,-h/2,w,h);if(m.kind==='sport'||m.kind==='roadster'){x.fillStyle='#d7dde0';x.fillRect(-w/2+3,-h/2+5,7,3);x.fillRect(w/2-10,-h/2+5,7,3)}x.fillStyle='#9ec4d0';const rh=Math.round(h*m.roof*.46),ry=-h/2+Math.round(h*m.nose);x.fillRect(-w*.34,ry,w*.68,rh);x.fillStyle='#24333c';x.fillRect(-w*.34,ry+rh+4,w*.68,Math.max(8,h*.14));x.fillStyle=m.c;x.fillRect(-3,ry,6,rh);if(m.kind==='van'){x.fillStyle='#b9d2d9';x.fillRect(-w*.35,8,w*.7,16)}if(m.kind==='roadster'){x.fillStyle='#17242b';x.fillRect(-w*.29,2,w*.58,18);x.fillStyle='#d7dde0';x.fillRect(-w*.33,-2,w*.66,3)}x.fillStyle='#ffe89a';x.fillRect(-w*.35,-h/2+2,8,5);x.fillRect(w*.35-8,-h/2+2,8,5);x.fillStyle='#b32727';x.fillRect(-w*.34,h/2-6,7,4);x.fillRect(w*.34-7,h/2-6,7,4);x.restore()}
function npcCar(cx,cy,w,h,color){x.save();x.translate(cx,cy);x.fillStyle='#111';x.fillRect(-w/2-3,-h*.3,5,h*.22);x.fillRect(w/2-2,-h*.3,5,h*.22);x.fillStyle=color;x.fillRect(-w/2,-h/2,w,h);x.fillStyle='#9fbfc8';x.fillRect(-w*.32,-h*.25,w*.64,h*.22);x.fillStyle='#263740';x.fillRect(-w*.32,h*.07,w*.64,h*.16);x.restore()}
function crash(){playing=false;const best=Math.max(+localStorage.getItem('steelDriveBest')||0,Math.floor(dist));localStorage.setItem('steelDriveBest',best);document.querySelector('#best').textContent=String(best).padStart(4,'0');menu.classList.remove('hidden');menu.querySelector('h1').textContent='BODY DAMAGE!';intro.innerHTML='주행거리 <b>'+Math.floor(dist)+'m</b><br>'+garage[selected].name+'로 다시 달려볼까?';go.textContent='RETRY'}function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.035);last=t;speed=Math.min(560,speed+dt*4);dist+=dt*speed*.055;roadOff+=dt*speed;if(Math.random()<dt*(.7+speed/500))spawn();px+=vx*dt;const rw=Math.min(W*.78,340);px=Math.max((W-rw)/2+27,Math.min((W+rw)/2-27,px));obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<H+100);road();obs.forEach(o=>npcCar(o.x,o.y,o.w,o.h,o.t==='truck'?'#d8a348':'#7190b0'));const me=garage[selected],mm=MODEL[me.k]||MODEL.h;playerCar(px,py,me.k);for(const o of obs)if(Math.abs(o.x-px)<(o.w+mm.w)*.42&&Math.abs(o.y-py)<(o.h+mm.h)*.42){crash();return}document.querySelector('#dist').textContent=String(Math.floor(dist)).padStart(4,'0');requestAnimationFrame(loop)}function steer(clientX){if(!playing)return;const r=cv.getBoundingClientRect();px=clientX-r.left}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);steer(e.clientX)});cv.addEventListener('pointermove',e=>{if(e.buttons)steer(e.clientX)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vx=-230;if(e.key==='ArrowRight')vx=230});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))vx=0});document.querySelector('#best').textContent=String(+localStorage.getItem('steelDriveBest')||0).padStart(4,'0');</script></body></html>
