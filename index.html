<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C99">
<meta name="description" content="하루 한 번 뽑기와 철강 퀴즈로 강종 캐릭터를 모으는 도감. 기획과 구성 by 곤사마.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스틸가챠">
<title>스틸 그레이드 가챠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
  :root{
    --bg:#E3E9EF;
    --f1:#F2F5F8; --f2:#E0E7ED; --f3:#D0DAE4; --edge:#BCC8D4;
    --ink:#16202B; --ink-2:#53616F; --ink-3:#8593A2;
    --ochre:#1F5C99; --ochre-d:#4C8AC4; --slate:#7F9DB8;
    --deep:#243342;
    --po:#BE473D; --cr:#2A6DA8; --ga:#7C5D91; --ok:#2E7D53;
    --cut:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6;
       padding:0 0 44px;position:relative;overflow-x:hidden}

  /* 큐비즘 배경 파편 */
  .facets{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .facets svg{position:absolute;top:0;left:50%;transform:translateX(-50%);
              width:820px;height:1400px;opacity:.62}
  .app{max-width:460px;margin:0 auto;padding:0 15px;position:relative;z-index:1}

  /* 잘린 모서리 = 큐비즘 면 */
  .cut{clip-path:polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut))}

  header{padding:30px 0 20px;position:relative}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.3em;
          text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .logo{font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.02;
        background:linear-gradient(112deg,#3E7FBF 0 34%,#1F5C99 34% 62%,#123F6E 62% 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-en{font-family:Archivo,sans-serif;font-weight:800;font-size:12px;letter-spacing:.24em;
           color:var(--ochre-d);margin:7px 0 0}
  .rule{height:2px;background:linear-gradient(90deg,var(--ochre) 0 22%,var(--edge) 22% 100%);margin-top:14px}

  .panel{background:var(--f1);border:1px solid var(--edge);padding:16px}

  .status{display:flex;gap:8px;margin:16px 0 12px}
  .st{flex:1;background:var(--f2);border:1px solid var(--edge);padding:11px 8px;text-align:center;
      --cut:9px}
  .st .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;
         font-variant-numeric:tabular-nums;line-height:1.1}
  .st .n.gold{color:var(--ochre)}
  .st .l{font-size:10.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}

  button{font:inherit;font-family:"IBM Plex Sans KR",sans-serif;cursor:pointer;border:0}
  button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  .btn-main{width:100%;padding:17px;font-size:16px;font-weight:700;letter-spacing:-.01em;
            background:linear-gradient(104deg,#3B82C4 0 40%,#1F5C99 40% 72%,#154270 72% 100%);
            color:#F2F7FB;position:relative;transition:filter .1s,transform .08s;--cut:16px}
  .btn-main:active:not(:disabled){transform:translateY(2px)}
  .btn-main:hover:not(:disabled){filter:brightness(1.07)}
  .btn-main:disabled{background:var(--f2);color:var(--ink-3);cursor:default;border:1px solid var(--edge)}
  .btn-sub{width:100%;padding:13px;font-size:13.5px;font-weight:600;margin-top:8px;
           background:var(--f2);color:var(--ink);border:1px solid var(--edge);--cut:12px}
  .btn-sub:hover:not(:disabled){background:var(--f3)}
  .btn-sub:disabled{color:var(--ink-3);cursor:default}

  /* 뽑기 결과 */
  .pull{margin-top:12px;background:var(--f1);border:1px solid var(--edge);display:none;--cut:18px}
  .pull.show{display:block;animation:shard .34s cubic-bezier(.2,.9,.3,1)}
  @keyframes shard{from{opacity:0;transform:translateY(10px) scale(.965)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.pull.show{animation:none}}
  .pull .stage{position:relative;padding:10px 10px 0;
               background:linear-gradient(128deg,#2E4054 0 38%,#26333F 38% 70%,#1D2833 70% 100%)}
  .pull .stage img{display:block;width:100%;height:auto;position:relative;z-index:1}
  .pull .beam{position:absolute;inset:0;z-index:0;
              background:linear-gradient(196deg,transparent 0 44%,rgba(120,170,220,.20) 44% 56%,transparent 56%)}
  .pull .rib{position:absolute;top:18px;left:18px;z-index:2;font-family:"IBM Plex Mono",monospace;
             font-size:11px;letter-spacing:.14em;font-weight:600;padding:4px 10px;
             background:var(--c);color:#F2F7FB;
             clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
  .pull .info{padding:14px 16px 17px;border-top:2px solid var(--c)}
  .pull .nm{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .pull .nm b{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .pull .nm span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
  .pull .nm em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--c)}
  .pull .kd{font-size:13px;color:var(--c);font-weight:600;margin:3px 0 0}
  .pull .q{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--c);padding-left:11px}
  .pull .new{color:var(--ok);font-size:11px;font-weight:700;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em}
  .pull .dup{color:var(--ink-3);font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em}

  /* 퀴즈 */
  .quiz{margin-top:12px;display:none;--cut:16px}
  .quiz.show{display:block}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;
         padding-bottom:9px;border-bottom:1px solid var(--edge)}
  .qhead .c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;color:var(--ink-3)}
  .qhead .s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;color:var(--ochre)}
  .qtext{font-size:15px;font-weight:600;margin:0 0 13px;line-height:1.55}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;padding:12px 14px;font-size:14px;background:var(--f2);
       border:1px solid var(--edge);color:var(--ink);width:100%;--cut:10px;
       clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
                 calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .opt:hover:not(:disabled){background:var(--f3)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:rgba(46,125,83,.13);color:var(--ok)}
  .opt.wrong{border-color:var(--po);background:rgba(190,71,61,.13);color:var(--po)}
  .qres{margin:6px 0 0;font-size:14px;color:var(--ink-2);text-align:center;line-height:1.8}
  .qres b{color:var(--ochre)}

  /* 도감 */
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 6px}
  .sec-h h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
  .sec-h .c{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ochre)}
  .sec-rule{height:2px;background:linear-gradient(90deg,var(--ochre) 0 14%,var(--edge) 14% 100%);
            margin-bottom:16px}

  .fam{margin-bottom:20px}
  .famh{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:13.5px;font-weight:700}
  .famh .chip{width:12px;height:12px;background:var(--c);
              clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
  .famh .sp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);font-weight:400;
            letter-spacing:.06em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cell{aspect-ratio:3/4;position:relative;background:var(--f1);border:1px solid var(--edge);
        display:flex;align-items:center;justify-content:center;--cut:11px;
        clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
                  calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell .g{position:absolute;bottom:0;left:0;right:0;
           background:linear-gradient(transparent,rgba(22,32,43,.9));
           padding:15px 5px 5px;font-family:"IBM Plex Mono",monospace;font-size:9px;
           letter-spacing:.04em;text-align:center;color:#F2F7FB}
  .cell.locked{background:
      linear-gradient(126deg,#DDE4EB 0 42%,#D2DBE4 42% 74%,#C6D1DC 74% 100%)}
  .cell.locked .qm{font-family:Archivo,sans-serif;font-size:21px;font-weight:800;color:#9AA8B6;
                   letter-spacing:.04em}
  .cell.locked .g{color:var(--ink-3);background:none}
  .cell.soon{opacity:.38}
  .cell.soon .qm{font-size:13px;font-family:"IBM Plex Sans KR",sans-serif;font-weight:600}
  .cell.have{border-color:var(--c);padding:0;font:inherit;cursor:pointer;transition:transform .1s}
  .cell.have:hover{transform:translateY(-2px)}
  .cell.have:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  .cell .gd{position:absolute;top:0;left:0;z-index:2;font-family:"IBM Plex Mono",monospace;
            font-size:8.5px;font-weight:600;letter-spacing:.05em;padding:2.5px 6px 3px 5px;
            background:var(--c);color:#F2F7FB;line-height:1;
            clip-path:polygon(0 0,100% 0,100% 62%,74% 100%,0 100%)}
  .cell.locked .gd{background:#A9B6C3;color:#F4F7FA}
  .cell.soon .gd{background:#B9C4CE}

  /* 확대 보기 */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
         background:rgba(16,24,33,.74);padding:18px}
  .modal.show{display:flex;animation:fadein .18s ease-out}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.modal.show{animation:none}}
  .modal .box{background:var(--f1);border:1px solid var(--edge);width:100%;max-width:380px;
              max-height:92vh;overflow-y:auto;position:relative;--cut:20px;
              clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
                        calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .modal .stage{position:relative;padding:10px 10px 0;
                background:linear-gradient(128deg,#2E4054 0 38%,#26333F 38% 70%,#1D2833 70% 100%)}
  .modal .stage img{display:block;width:100%;height:auto}
  .modal .rib{position:absolute;top:18px;left:18px;font-family:"IBM Plex Mono",monospace;
              font-size:11px;letter-spacing:.14em;font-weight:600;padding:4px 10px;
              background:var(--c);color:#F2F7FB;
              clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
  .modal .x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;
            background:rgba(20,28,38,.62);color:#F2F7FB;font-size:20px;line-height:1;
            border:0;cursor:pointer;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .modal .info{padding:15px 17px 19px;border-top:2px solid var(--c)}
  .modal .nm{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .modal .nm b{font-size:23px;font-weight:700;letter-spacing:-.02em}
  .modal .nm em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:13px;
                font-weight:600;color:var(--c)}
  .modal .nm span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
  .modal .kd{font-size:13px;color:var(--c);font-weight:600;margin:3px 0 0}
  .modal .q{margin:11px 0 0;font-size:14px;color:var(--ink-2);border-left:2px solid var(--c);
            padding-left:11px;line-height:1.65}
  .modal .rows{display:flex;flex-direction:column;border-top:1px solid var(--edge);margin:13px 0 0}
  .modal .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
            border-bottom:1px solid var(--edge)}
  .modal .r dt{margin:0;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
               letter-spacing:.08em}
  .modal .r dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right}

  footer{margin-top:34px;padding-top:20px;position:relative;text-align:center}
  footer::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
                 background:linear-gradient(90deg,var(--edge) 0 62%,var(--ochre) 62% 100%)}
  footer .by{font-size:13.5px;color:var(--ink-2);margin:0}
  footer .by b{color:var(--ochre);font-weight:700}
  footer .sm{font-size:11px;color:var(--ink-3);margin:8px 0 0;line-height:1.7}
  .reset{background:none;border:0;color:var(--ink-3);font-size:11px;
         text-decoration:underline;margin-top:12px;padding:5px}
</style>

<div class="facets" aria-hidden="true">
  <svg viewBox="0 0 820 1400" preserveAspectRatio="xMidYMin slice">
    <polygon points="0,0 340,0 120,330" fill="#D6DFE8"/>
    <polygon points="340,0 820,0 820,200 470,300" fill="#DDE5EC"/>
    <polygon points="0,300 260,190 400,520 90,610" fill="#D9E2EA"/>
    <polygon points="470,260 820,180 820,560 560,520" fill="#CFDAE5"/>
    <polygon points="90,600 430,500 560,880 140,940" fill="#DFE6ED"/>
    <polygon points="560,520 820,540 820,900 600,880" fill="#D4DEE7"/>
    <polygon points="140,930 600,870 700,1210 60,1250" fill="#DAE3EB"/>
    <polygon points="0,1240 700,1200 820,1400 0,1400" fill="#D1DCE6"/>
    <g opacity=".55">
      <path d="M120 330 L400 520 L560 880 L700 1210" stroke="#A9BAC9" stroke-width="1.2" fill="none"/>
      <path d="M340 0 L470 300 L560 520 L600 880" stroke="#A9BAC9" stroke-width="1.2" fill="none"/>
      <path d="M0 300 L260 190 L470 260 L820 180" stroke="#A9BAC9" stroke-width="1.2" fill="none"/>
    </g>
    <g opacity=".16">
      <polygon points="560,520 820,540 600,880" fill="#1F5C99"/>
      <polygon points="0,0 120,330 0,300" fill="#1F5C99"/>
    </g>
  </svg>
</div>

<div class="app">

<header>
  <p class="kicker">Grade Collection</p>
  <h1 class="logo">스틸 그레이드 가챠</h1>
  <p class="logo-en">STEEL GRADE GACHA</p>
  <div class="rule"></div>
</header>

<div class="status">
  <div class="st cut"><div class="n gold" id="stPulls">1</div><div class="l">남은 뽑기</div></div>
  <div class="st cut"><div class="n" id="stOwned">0</div><div class="l">보유</div></div>
  <div class="st cut"><div class="n" id="stRate">0%</div><div class="l">완성도</div></div>
</div>

<button class="btn-main cut" id="btnPull">오늘의 뽑기</button>
<button class="btn-sub cut" id="btnQuiz">철강 퀴즈 · 5문제 다 맞추면 뽑기 +1</button>

<div class="pull cut" id="pullBox"></div>
<div class="quiz panel cut" id="quizBox"></div>

<div class="sec-h">
  <h2>도감</h2>
  <span class="c" id="dexCount"></span>
</div>
<div class="sec-rule"></div>
<div id="dex"></div>

<footer>
  <p class="by">기획과 구성 by <b>곤사마</b></p>
  <p class="sm">프로토타입입니다. 진행 상황은 이 기기에만 저장됩니다.<br>
     규격은 일본철강연맹(JFS) 자동차용 강판 기준입니다.</p>
  <button class="reset" id="btnReset">진행 초기화</button>
</footer>

</div>

<div class="modal" id="cardModal" role="dialog" aria-modal="true" aria-label="캐릭터 상세">
  <div class="box" id="cardBox"></div>
</div>

var QUIZ = [

var POOL = Object.keys(IMG);
var KEY = "steelgrade_gacha_v1";
var S = { owned:{}, last:"", extra:0, quizDay:"" };

function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function load(){ try{ var r=localStorage.getItem(KEY); if(r){ var p=JSON.parse(r);
  S.owned=p.owned||{}; S.last=p.last||""; S.extra=p.extra||0; S.quizDay=p.quizDay||""; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function pullsLeft(){ return (S.last===today()?0:1) + S.extra; }
function allChars(){ var a=[]; FAMS.forEach(function(f){ f.list.forEach(function(c){
  a.push(Object.assign({}, c, {fam:f})); }); }); return a; }
function findChar(id){ var r=null; allChars().forEach(function(c){ if(c.id===id) r=c; }); return r; }

function refresh(){
  var n = Object.keys(S.owned).length, total = allChars().length;
  document.getElementById("stPulls").textContent = pullsLeft();
  document.getElementById("stOwned").textContent = n;
  document.getElementById("stRate").textContent = Math.round(n/total*100)+"%";
  document.getElementById("dexCount").textContent = n+" / "+total;
  var bp = document.getElementById("btnPull");
  bp.disabled = pullsLeft()<=0;
  bp.textContent = pullsLeft()>0 ? "뽑기 ("+pullsLeft()+"회)" : "오늘의 뽑기 완료";
  var qb = document.getElementById("btnQuiz");
  var done = S.quizDay===today();
  qb.disabled = done;
  qb.textContent = done ? "오늘 퀴즈 완료" : "철강 퀴즈 · 5문제 다 맞추면 뽑기 +1";
  renderDex();
}

function renderDex(){
  var host = document.getElementById("dex"); host.innerHTML="";
  FAMS.forEach(function(f){
    var wrap = document.createElement("div"); wrap.className="fam"; wrap.style.setProperty("--c", f.c);
    var h = document.createElement("p"); h.className="famh";
    h.innerHTML = String(String.raw`<span class="chip"></span>`) + f.name + " (" + f.abbr + ") " + String.raw`<span class="sp">` + f.pre + " · " + f.std + String.raw`</span>`;
    wrap.appendChild(h);
    var g = document.createElement("div"); g.className="grid";
    f.list.forEach(function(c){
      var have = !!S.owned[c.id], art = IMG[c.id];
      var cell = document.createElement(have ? "button" : "div");
      if(have){ cell.type = "button"; cell.setAttribute("aria-label", f.name+" "+c.g+" 크게 보기"); }
      cell.className = "cell" + (have?" have":" locked") + (!art&&!have?" soon":"");
      var gd = document.createElement("span"); gd.className="gd"; gd.textContent=c.g;
      cell.appendChild(gd);
      if(have && art){
        var im = document.createElement("img"); im.src=art;
        im.alt = f.name+" "+c.g+" · "+c.code; cell.appendChild(im);
        cell.addEventListener("click", function(){ openCard(c.id); });
      } else {
        var qm = document.createElement("div"); qm.className="qm";
        qm.textContent = art ? "???" : "준비중"; cell.appendChild(qm);
      }
      if(have){
        var lab = document.createElement("div"); lab.className="g";
        lab.textContent = c.code; cell.appendChild(lab);
      }
      g.appendChild(cell);
    });
    wrap.appendChild(g); host.appendChild(wrap);
  });
}

document.getElementById("btnPull").addEventListener("click", function(){
  if(pullsLeft()<=0) return;
  if(S.last!==today()) S.last=today(); else S.extra--;
  var id = POOL[Math.floor(Math.random()*POOL.length)];
  var isNew = !S.owned[id];
  S.owned[id]=true; save();
  var c = findChar(id), f = c.fam;
  var box = document.getElementById("pullBox");
  box.style.setProperty("--c", f.c);
  box.innerHTML =
    '<div class="stage"><div class="beam"></div><span class="rib">'+c.g+'</span>'+
    '<img src="'+IMG[id]+'" alt="'+f.name+' '+c.g+'"></div>'+
    '<div class="info"><div class="nm"><b>'+f.name+'</b><em>('+f.abbr+')</em>'+
    '<span>'+c.code+'</span>'+
    (isNew?'<span class="new">NEW</span>':'<span class="dup">중복</span>')+'</div>'+
    '<p class="kd">'+f.kind+' · '+c.t+'</p>'+
    '<p class="q">"'+c.line+'"</p></div>';
  box.classList.remove("show"); void box.offsetWidth; box.classList.add("show");
  refresh();
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
});

var qState = null;
document.getElementById("btnQuiz").addEventListener("click", function(){
  if(S.quizDay===today()) return;
  var pool = QUIZ.slice(), pick=[];
  for(var i=0;i<5 && pool.length;i++) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  qState = {qs:pick, i:0, right:0};
  document.getElementById("quizBox").classList.add("show");
  renderQ();
});

function renderQ(){
  var box = document.getElementById("quizBox");
  if(qState.i >= qState.qs.length){
    var pass = qState.right===qState.qs.length;
    S.quizDay = today();
    if(pass) S.extra++;
    save();
    box.innerHTML = '<p class="qres">'+qState.right+' / '+qState.qs.length+' 정답<br>'+
      (pass ? '<b>뽑기 기회 +1</b> 획득했습니다.' : '다섯 개를 다 맞춰야 뽑기를 받습니다. 내일 다시.')+'</p>';
    refresh();
    return;
  }
  var q = qState.qs[qState.i];
  box.innerHTML = '<div class="qhead"><span class="c">Q '+(qState.i+1)+' / '+qState.qs.length+'</span>'+
                  '<span class="s">정답 '+qState.right+'</span></div>'+
                  '<p class="qtext">'+q.q+'</p><div class="opts" id="opts"></div>';
  var o = document.getElementById("opts");
  q.o.forEach(function(txt, idx){
    var b = document.createElement("button"); b.className="opt"; b.type="button"; b.textContent=txt;
    b.addEventListener("click", function(){
      var all = o.querySelectorAll("button");
      for(var k=0;k<all.length;k++) all[k].disabled = true;
      if(idx===q.a){ b.classList.add("right"); qState.right++; }
      else { b.classList.add("wrong"); all[q.a].classList.add("right"); }
      setTimeout(function(){ qState.i++; renderQ(); }, 850);
    });
    o.appendChild(b);
  });
}

var modal = document.getElementById("cardModal");
var cardBox = document.getElementById("cardBox");
var lastFocus = null;

function openCard(id){
  var c = findChar(id); if(!c) return;
  var f = c.fam;
  lastFocus = document.activeElement;
  modal.style.setProperty("--c", f.c);
  cardBox.innerHTML =
    '<button class="x" type="button" id="cardX" aria-label="닫기">&times;</button>' +
    '<div class="stage"><span class="rib">'+c.g+'</span>' +
    '<img src="'+IMG[id]+'" alt="'+f.name+' '+c.g+' · '+c.code+'"></div>' +
    '<div class="info"><div class="nm"><b>'+f.name+'</b><em>('+f.abbr+')</em>' +
    '<span>'+c.code+'</span></div>' +
    '<p class="kd">'+f.kind+' · '+c.t+'</p>' +
    '<p class="q">"'+c.line+'"</p>' +
    '<dl class="rows">' +
      '<div class="r"><dt>등급</dt><dd>'+c.g+'</dd></div>' +
      '<div class="r"><dt>규격</dt><dd>'+f.std+'</dd></div>' +
      '<div class="r"><dt>강종 기호</dt><dd>'+c.code+'</dd></div>' +
      '<div class="r"><dt>품종</dt><dd>'+f.abbr+' · '+f.pre+'</dd></div>' +
    '</dl></div>';
  modal.classList.add("show");
  document.body.style.overflow = "hidden";
  var x = document.getElementById("cardX");
  x.addEventListener("click", closeCard);
  x.focus();
}

function closeCard(){
  modal.classList.remove("show");
  document.body.style.overflow = "";
  cardBox.innerHTML = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

modal.addEventListener("click", function(e){ if(e.target === modal) closeCard(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && modal.classList.contains("show")) closeCard();
});

document.getElementById("btnReset").addEventListener("click", function(){
  S = { owned:{}, last:"", extra:0, quizDay:"" }; save();
  document.getElementById("pullBox").classList.remove("show");
  document.getElementById("quizBox").classList.remove("show");
  refresh();
});

load();
refresh();
</script>

    </span>
    <button class="go" id="installGo" type="button">설치</button>
    <button class="x" id="installX" type="button" aria-label="닫기">&times;</button>
  </div>
  <p class="steps" id="installSteps"></p>

<script>
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  var bar = document.getElementById("installBar");
  var go = document.getElementById("installGo");
  var x = document.getElementById("installX");
  var sub = document.getElementById("installSub");
  var steps = document.getElementById("installSteps");
  var deferred = null;
  var DISMISS = "sgg_install_dismissed";

  function dismissed(){ try{ return localStorage.getItem(DISMISS)==="1"; }catch(e){ return false; } }
  function dismiss(){ try{ localStorage.setItem(DISMISS,"1"); }catch(e){} bar.classList.remove("show"); }

  var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);

  x.addEventListener("click", dismiss);

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
    if(!standalone && !dismissed()) bar.classList.add("show");
  });

  go.addEventListener("click", function(){
    if(deferred){
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; bar.classList.remove("show"); });
      return;
    }
    steps.classList.add("show");
    go.textContent = "확인";
    if(deferred === null && steps.textContent === ""){
      steps.innerHTML = isIOS
        ? '아이폰은 사파리에서 이렇게 설치합니다.<br>1. 아래 가운데 <b>공유 버튼</b>(네모에 화살표)을 누릅니다.<br>2. 목록을 내려 <b>홈 화면에 추가</b>를 누릅니다.<br>3. 오른쪽 위 <b>추가</b>를 누르면 끝입니다.'
        : '브라우저 <b>메뉴(⋮)</b>를 열고 <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.';
    }
  });

  window.addEventListener("appinstalled", function(){ bar.classList.remove("show"); });

  if(!standalone && !dismissed()){
    if(isIOS){
      sub.textContent = "사파리 공유 버튼으로 홈 화면에 추가할 수 있습니다.";
      go.textContent = "방법 보기";
      setTimeout(function(){ bar.classList.add("show"); }, 1200);
    } else if(isAndroid){
      setTimeout(function(){ if(!deferred) bar.classList.add("show"); }, 2000);
    }
  }
})();
</script>
