<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Task23 실제 레이어 검토</title><link rel="stylesheet" href="/src/game/game.css"><style>body{margin:20px;background:#161b20;color:#f2eee5;font:16px/1.5 system-ui}button,select{font:inherit;min-height:44px;margin:4px;padding:8px;background:#242c33;color:#f2eee5;border:1px solid #b4bbc2;border-radius:12px}main{width:min(100%,360px)}#core{display:none}#status{max-width:600px}</style><h1>실제 레이어 검토</h1><p>명시적 테스트 상태 · 실제 경제 함수와 원화 · 저장하지 않음</p><label>소재와 면 <select id="face"></select></label><button id="full">전체 호환 장비</button><button id="before">장착 전</button><button id="preview">미리보기</button><button id="cancel">취소</button><p id="status" role="status">로드 중</p><main id="card"></main><iframe id="core" src="/index.html" title="실제 카탈로그 함수"></iframe><script src="/src/game/presentation.js"></script><script>
(async()=>{
 const m=await fetch('/docs/design/game-asset-manifest.json').then(r=>r.json()),f=await fetch('/docs/design/game-reviews/placements/manifest-fragment.json').then(r=>r.json());
 window.GAME_CONFIG={assets:Object.fromEntries(m.assets.map(a=>[a.assetId,{url:'/'+a.path}])),faces:m.faces,placements:f.placements.map(p=>p.value)};
 const iframe=document.querySelector('#core');while(!iframe.contentWindow.ITEMS)await new Promise(r=>setTimeout(r,30));const core=iframe.contentWindow;
 GAME_PRESENTATION.boot({findChar:core.findChar,items:core.ITEMS,getState:()=>core.S});
 const menu=document.querySelector('#face');m.faces.forEach((face,i)=>menu.add(new Option(face.cardId+' '+face.side,String(i))));menu.value=String(m.faces.findIndex(f=>f.cardId==='ssial-270E'));
 let mode='full';async function render(){const face=m.faces[Number(menu.value)],items=core.ITEMS.filter(i=>i.fit(core.findChar(face.cardId))),state={owned:{[face.cardId]:true},stock:{[face.cardId]:0},items:Object.fromEntries(items.map(i=>[i.key,mode==='full'?face.cardId:1]))},before=JSON.stringify(core.S),snapshot=JSON.stringify(state),view=GAME_PRESENTATION.render({cardId:face.cardId,side:face.side,state,previewItem:mode==='preview'?items[0]?.key:null});document.querySelector('#card').replaceChildren(view.element);await view.ready;document.querySelector('#status').textContent=face.cardId+' '+face.side+' · '+view.items.length+' 장비 · 상태 불변 '+(before===JSON.stringify(core.S)&&snapshot===JSON.stringify(state));}
 menu.onchange=render;document.querySelector('#full').onclick=()=>{mode='full';render()};document.querySelector('#before').onclick=document.querySelector('#cancel').onclick=()=>{mode='before';render()};document.querySelector('#preview').onclick=()=>{mode='preview';render()};await render();
})();
</script></html>
