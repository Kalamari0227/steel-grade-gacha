<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스틸 컴패니언 · 게임풍 화면 시안 U0</title>
<style>
:root{
  --brass:#f5cc75; --brass-hi:#ffe9ae; --brass-lo:#b98428; --brass-edge:#6f4b12;
  --cut:10px;
  font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  word-break:keep-all; font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#07090c;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #6fb3ff;outline-offset:2px}
img{display:block}

/* 시안 조작 띠: 게임 화면이 아니다 */
#mockbar{height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#000;color:#aab;font-size:12px;overflow-x:auto;white-space:nowrap}
#mockbar b{color:#fff;margin-right:4px}
#mockbar button{min-height:28px;padding:0 10px;border:1px solid #445;border-radius:14px;color:#ccd}
#mockbar button[aria-pressed=true]{background:#f5cc75;color:#201400;border-color:#f5cc75;font-weight:700}
#mockbar i{width:1px;height:18px;background:#334;margin:0 4px;flex:none}

/* 두 가지 안 */
#stage[data-theme=a]{
  --bg-filter:brightness(.42) saturate(.8) contrast(1.05);
  --tint:linear-gradient(180deg,rgba(8,13,22,.86),rgba(10,16,28,.25) 30%,rgba(10,16,28,.2) 55%,rgba(6,9,14,.94));
  --glow:radial-gradient(60% 46% at 50% 52%,rgba(255,206,120,.34),transparent 70%);
  --panel:rgba(15,20,28,.9); --panel2:rgba(30,38,50,.92); --ink:#f4ecd9; --muted:#b4ab97;
  --line:linear-gradient(160deg,#f5cc75,#7d6230 40%,#f5cc75 70%,#5d4720);
  --track:#2a3340; --name-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.8);
}
#stage[data-theme=b]{
  --bg-filter:saturate(1.05);
  --tint:linear-gradient(180deg,rgba(255,244,220,.5),transparent 26%,transparent 58%,rgba(46,28,10,.72));
  --glow:radial-gradient(60% 46% at 50% 52%,rgba(255,240,200,.5),transparent 70%);
  --panel:rgba(255,250,238,.94); --panel2:rgba(240,228,204,.96); --ink:#2a221a; --muted:#6c5f4c;
  --line:linear-gradient(160deg,#c79a45,#8a6524 40%,#e6bd68 70%,#7a5718);
  --track:#d9ccb2; --name-shadow:0 2px 0 #2a1a08,0 0 16px rgba(40,22,4,.75);
}

#stage[data-theme=c]{
  --panel:rgba(15,20,28,.9); --panel2:rgba(30,38,50,.92); --ink:#f4ecd9; --muted:#b4ab97;
  --line:linear-gradient(160deg,#f5cc75,#7d6230 40%,#f5cc75 70%,#5d4720);
  --track:#2a3340; --name-shadow:0 2px 0 #1c1206,0 0 16px rgba(30,16,2,.85);
}
#stage[data-theme=c] .lobby{
  --bg-filter:saturate(1.05);
  --tint:linear-gradient(180deg,rgba(40,24,8,.45),transparent 24%,transparent 56%,rgba(30,18,6,.8));
  --glow:radial-gradient(60% 46% at 50% 52%,rgba(255,240,200,.4),transparent 70%);
}
#stage[data-theme=c] .ship,#stage[data-theme=c] .char{
  --bg-filter:brightness(.42) saturate(.8) contrast(1.05);
  --tint:linear-gradient(180deg,rgba(8,13,22,.86),rgba(10,16,28,.25) 30%,rgba(10,16,28,.2) 55%,rgba(6,9,14,.94));
  --glow:radial-gradient(60% 46% at 50% 52%,rgba(255,206,120,.34),transparent 70%);
}
#stage{position:relative;height:calc(100dvh - 40px);overflow:hidden;color:var(--ink);isolation:isolate}
.screen{position:absolute;inset:0;display:none}
#stage[data-screen=lobby] .lobby,#stage[data-screen=ship] .ship,#stage[data-screen=char] .char{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:var(--bg-filter);z-index:-3}
.tint{position:absolute;inset:0;background:var(--tint);z-index:-2}
.glow{position:absolute;inset:0;background:var(--glow);z-index:-1;mix-blend-mode:screen}

/* 모서리를 깎은 금속판 */
.plate{position:relative;background:var(--line);padding:1.5px;
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.plate>.in{height:100%;background:var(--panel);
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-family:"DIN Alternate","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
.display{font-weight:900;letter-spacing:-.04em;line-height:1.05}

/* 버튼 */
.btn{position:relative;min-height:56px;padding:8px 18px;border-radius:12px;text-align:center;display:grid;place-content:center;gap:1px;
  transition:transform .08s,box-shadow .08s}
.btn strong{font-size:18px;font-weight:900;letter-spacing:-.03em}
.btn small{font-size:12px;font-weight:700;opacity:.82}
.btn.brass{color:#2a1a02;background:linear-gradient(180deg,var(--brass-hi),var(--brass) 46%,var(--brass-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(90,55,5,.35),0 4px 0 var(--brass-edge),0 10px 22px rgba(0,0,0,.5)}
.btn.steel{color:#f1f4f7;background:linear-gradient(180deg,#77848f,#48535e 46%,#2c343d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.3),0 4px 0 #161b21,0 10px 22px rgba(0,0,0,.5)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 var(--brass-edge)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:var(--panel);box-shadow:0 0 0 1.5px rgba(245,204,117,.7),0 4px 10px rgba(0,0,0,.45)}
.round svg{width:22px;height:22px}
.side button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;text-shadow:var(--name-shadow);color:#fff}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:5}
.player{display:flex;align-items:center;gap:8px;min-width:0}
.emblem{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--brass),0 3px 8px rgba(0,0,0,.5);background:#1a2230}
.emblem img{width:100%;height:100%;object-fit:cover}
.player .who{font-weight:800;font-size:14px;text-shadow:var(--name-shadow);color:#fff}
.bar{width:92px;height:6px;border-radius:3px;background:rgba(0,0,0,.55);overflow:hidden;margin-top:3px;box-shadow:0 0 0 1px rgba(245,204,117,.5)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}
.player .cnt{font-size:11px;color:#fff;text-shadow:var(--name-shadow)}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 4px;border-radius:16px;background:rgba(8,11,16,.82);color:#fff;
  box-shadow:0 0 0 1.5px rgba(245,204,117,.6)}
.chip img,.chip .nut{width:24px;height:24px;flex:none}
.chip img{object-fit:contain}
.nut{background:linear-gradient(145deg,#e8edf2,#7c8894);clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);position:relative}
.nut::after{content:'';position:absolute;inset:32%;border-radius:50%;background:#10151c}
.chip .num{font-size:16px}
.back{display:flex;align-items:center;gap:4px;height:40px;padding:0 14px 0 8px;border-radius:20px;background:rgba(8,11,16,.82);color:#fff;font-weight:800;
  box-shadow:0 0 0 1.5px rgba(245,204,117,.6)}

/* 하단 독 */
.dock{position:absolute;left:8px;right:8px;bottom:8px;height:66px;z-index:6;--cut:14px}
.dock .plate{position:absolute;inset:0}
.dock .row{position:relative;height:100%;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.dock button{height:63px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.dock img{height:32px;width:44px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dock img.cardico{width:22px;object-fit:cover;object-position:50% 20%;border-radius:3px;box-shadow:0 0 0 1.5px var(--brass);background:#2a3340}
.dock button{position:relative}
.dock .dot{position:absolute;top:8px;left:calc(50% + 14px);width:9px;height:9px;border-radius:50%;background:#ff5a4d;box-shadow:0 0 0 2px rgba(10,14,20,.9)}
.dock button[aria-current]{color:var(--ink)}
.dock .home{position:relative;color:#2a1a02}
.dock .home span{position:absolute;left:50%;bottom:16px;translate:-50% 0;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,var(--brass-hi),var(--brass) 55%,var(--brass-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 var(--brass-edge),0 0 0 4px rgba(10,14,20,.9),0 0 22px rgba(245,204,117,.55)}
.dock .home img{width:52px;height:52px}
.dock .home em{font-style:normal;color:var(--ink);font-weight:800;align-self:end;padding-bottom:6px}

/* 로비 */
.hero{position:absolute;left:50%;bottom:232px;translate:-50% 0;height:min(56%,520px);aspect-ratio:2/3;z-index:1}
.hero img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.5));animation:breathe 4.5s ease-in-out infinite;transform-origin:50% 100%}
.hero::after{content:'';position:absolute;left:14%;right:14%;bottom:1%;height:7%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),transparent 70%);z-index:-1}
@keyframes breathe{50%{transform:scale(1.012,1.02) translateY(-.4%)}}
.say{position:absolute;right:12px;top:74px;max-width:54%;z-index:3;--cut:8px}
.say .in{padding:9px 12px;font-size:13px;font-weight:600}
.nameplate{position:absolute;left:0;right:0;bottom:172px;text-align:center;z-index:3;color:#fff;text-shadow:var(--name-shadow)}
.stars{color:var(--brass);font-size:15px;letter-spacing:2px}
.rare{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--brass);border-radius:3px;font-size:10px;letter-spacing:.14em;color:var(--brass);vertical-align:2px;text-shadow:none;background:rgba(0,0,0,.5)}
.nameplate h1{font-size:15px;font-weight:700}
.nameplate h1 b{font-size:30px;font-weight:900;letter-spacing:-.04em;margin-left:5px}
.side{position:absolute;left:12px;top:76px;display:grid;gap:12px;z-index:4}
.actions{position:absolute;left:8px;right:8px;bottom:84px;display:grid;grid-template-columns:1fr 1.15fr;gap:8px;z-index:4}
.goal .in{display:flex;align-items:center;gap:8px;padding:8px 10px;height:76px}
.goal img{width:66px;height:44px;object-fit:contain;flex:none}
.goal h2{font-size:17px;font-weight:900;letter-spacing:-.03em}
.goal .bar{width:100%;background:var(--track);box-shadow:none}
.shipgo{min-height:76px;justify-items:start;text-align:left;padding-left:84px;overflow:visible}
.shipgo img{position:absolute;left:-6px;bottom:-4px;width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.motes{position:absolute;inset:0;pointer-events:none;z-index:2}
.motes i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9ae;box-shadow:0 0 8px 2px rgba(255,220,140,.7);opacity:0;animation:rise 7s linear infinite}
@keyframes rise{10%{opacity:.9}90%{opacity:.5}100%{transform:translate(18px,-46vh);opacity:0}}

/* 출하 */
.ribbon{position:absolute;left:0;right:0;top:66px;text-align:center;color:#fff;text-shadow:var(--name-shadow);z-index:3}
.ribbon .label{color:var(--brass)}
.ribbon h1{font-size:38px}
.ribbon p{font-size:13px;font-weight:600;margin-top:4px}
.cast{position:absolute;left:0;right:0;bottom:268px;height:44%;z-index:1}
.cast img{position:absolute;bottom:0;height:100%;aspect-ratio:2/3;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.cast .l{left:-9%;height:82%;filter:brightness(.72) drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.cast .r{right:-9%;height:82%;filter:brightness(.72) drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.cast .c{left:50%;translate:-50% 0}
.coil{position:absolute;left:50%;bottom:222px;translate:-50% 0;width:min(46%,230px);z-index:2;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6));animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{translate:-50% -6px}}
.rates{position:absolute;left:8px;right:8px;bottom:160px;z-index:4;--cut:8px}
.rates .in{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;font-weight:700}
.rates span{display:inline-flex;gap:3px;align-items:baseline}
.rates .s{color:var(--brass-lo)} #stage:not([data-theme=b]) .rates .s{color:var(--brass)}
.rates button{margin-left:auto;min-height:44px;padding:0 6px;text-decoration:underline;text-underline-offset:3px;font-weight:800}
.pulls{position:absolute;left:8px;right:8px;bottom:84px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:4}
.pulls .btn{min-height:68px}

/* 캐릭터 */
.char .hero{bottom:auto;top:54px;height:min(50%,480px)}
.char .ja{position:absolute;right:14px;top:70px;writing-mode:vertical-rl;font:600 14px/1.7 "Hiragino Mincho ProN","Yu Mincho",serif;color:#fff;text-shadow:0 0 3px #1a1206,0 0 3px #1a1206,0 2px 0 #1a1206;max-height:40%;z-index:3}
.char .nameplate{bottom:auto;top:calc(54px + min(50%,480px) - 26px)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;--cut:14px}
.sheet .in{padding:12px 14px 14px;display:grid;gap:10px}
.quote{font:600 14px/1.5 "AppleMyungjo","Nanum Myeongjo",serif;border-left:3px solid var(--brass);padding-left:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;background:var(--track);padding:3px;gap:3px}
.seg button{min-height:44px;border-radius:8px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#2a1a02;box-shadow:0 2px 0 var(--brass-edge)}
.slots{display:flex;gap:10px;align-items:center}
.slot{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);box-shadow:inset 0 0 0 1.5px rgba(245,204,117,.75),inset 0 6px 10px rgba(0,0,0,.25);position:relative}
.slot img{width:46px;height:46px;object-fit:contain}
.slot[aria-pressed=false] img{opacity:.28;filter:grayscale(1)}
.slot[aria-pressed=true]::after{content:'장착';position:absolute;right:-4px;top:-6px;font-size:9px;font-weight:900;background:var(--brass);color:#2a1a02;border-radius:6px;padding:1px 5px}
.gauge{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.gauge b{font-weight:700}.gauge .num{font-size:15px}
.gauge .bar{width:100%;height:8px;border-radius:4px;background:var(--track);box-shadow:none;margin:0}
.use{font-size:12px;color:var(--muted)}

/* 넓은 화면: 세로 독과 가로 배치 */
@media (min-width:900px){
  .dock{left:14px;right:auto;top:84px;bottom:auto;width:88px;height:auto}
  .dock .row{grid-template-columns:1fr;padding:8px 0}
  .dock button{height:72px;font-size:12px}
  .dock .home{order:-1;height:96px}
  .dock .home span{position:static;translate:none;margin-bottom:4px}
  .dock .home em{padding:0}
  .hud{padding:16px 24px}
  .side{left:auto;right:24px;top:84px;grid-auto-flow:column}
  .lobby .hero{left:42%;bottom:6%;height:78%}
  .lobby .nameplate{left:120px;right:auto;bottom:40px;text-align:left}
  .lobby .nameplate h1 b{font-size:44px}
  .say{right:auto;left:58%;top:22%;max-width:300px}
  .say .in{font-size:15px;padding:12px 16px}
  .actions{left:auto;right:24px;bottom:28px;width:360px;grid-template-columns:1fr}
  .goal .in{height:84px}
  .shipgo{min-height:96px}
  .ribbon{top:84px;left:120px;right:auto;text-align:left}.ribbon h1{font-size:58px}
  .cast{left:22%;right:22%;bottom:4%;height:74%}
  .cast .l{left:0}.cast .r{right:0}
  .coil{bottom:3%;width:250px}
  .rates{left:auto;right:24px;bottom:140px;width:420px}
  .pulls{left:auto;right:24px;bottom:28px;width:420px}.pulls .btn{min-height:88px}
  .char .hero{left:36%;top:auto;bottom:4%;height:86%}
  .char .ja{right:auto;left:58%;top:16%;font-size:18px}
  .char .nameplate{top:auto;bottom:40px;left:40px;right:auto;text-align:left}
  .char .nameplate h1 b{font-size:44px}
  .sheet{left:auto;right:24px;bottom:28px;width:400px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mockbar" role="toolbar" aria-label="시안 조작">
  <b>시안 U0</b>
  <button data-theme="a" aria-pressed="true">A안 · 강철 야간</button>
  <button data-theme="b" aria-pressed="false">B안 · 노을 공방</button>
  <button data-theme="c" aria-pressed="false">C안 · 밝은 로비 + 짙은 판</button>
  <i></i>
  <button data-screen="lobby" aria-pressed="true">로비</button>
  <button data-screen="ship" aria-pressed="false">출하</button>
  <button data-screen="char" aria-pressed="false">캐릭터</button>
  <i></i><span>수치는 시안용 예시 · 독 아이콘은 승인 그림 시험 · 바로가기 아이콘은 임시 도형 · 글꼴은 시스템 글꼴</span>
</div>

<main id="stage" data-theme="a" data-screen="lobby">
  <!-- 로비 -->
  <section class="screen lobby" aria-label="로비">
    <img class="bg" data-a="scene:workshop:back" alt=""><div class="tint"></div><div class="glow"></div>
    <div class="motes" aria-hidden="true"></div>
    <header class="hud">
      <div class="player"><span class="emblem"><img data-a="icon:192" alt=""></span>
        <div><div class="who">공방장</div><div class="bar"><i style="width:27%"></i></div><div class="cnt num">도감 12 / 45</div></div></div>
      <div class="chips">
        <span class="chip" title="남은 출하"><img data-a="draw:coil-pack" alt="출하"><span class="num">13</span></span>
        <span class="chip" title="스크랩"><span class="nut" role="img" aria-label="스크랩"></span><span class="num">60</span></span>
      </div>
    </header>
    <nav class="side" aria-label="바로가기">
      <button><span class="round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.700000000000001 19.6l1.1-6L3.4 9.4l6-.8z"/></svg></span>선행개발</button>
      <button><span class="round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg></span>소리</button>
      <button><span class="round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600000000000001 5.600000000000001l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.600000000000001l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>설정</button>
    </nav>
    <div class="plate say"><div class="in" data-t="ko"></div></div>
    <div class="hero"><img data-app="front:" alt="도금이 1470H 전신"></div>
    <div class="nameplate"><div class="stars">★★★★★<span class="rare">RARE</span></div><h1>도금이<b>1470H</b></h1></div>
    <div class="actions">
      <div class="plate goal"><div class="in"><img data-a="part:roof" alt="">
        <div style="flex:1;min-width:0"><div class="label">다음 제작 목표</div><h2>루프</h2><div class="bar"><i style="width:50%"></i></div></div></div></div>
      <button class="btn brass shipgo" data-go="ship"><img data-a="draw:coil-pack" alt=""><strong>코일 출하</strong><small>남은 출하 13회</small></button>
    </div>
  </section>

  <!-- 출하 -->
  <section class="screen ship" aria-label="출하">
    <img class="bg" data-a="background:ga" alt=""><div class="tint"></div><div class="glow"></div>
    <header class="hud">
      <button class="back" data-go="lobby">‹ 공방</button>
      <div class="chips">
        <span class="chip"><img data-a="draw:coil-pack" alt="출하"><span class="num">13</span></span>
        <span class="chip"><span class="nut" role="img" aria-label="스크랩"></span><span class="num">60</span></span>
      </div>
    </header>
    <div class="ribbon"><div class="label">정기 출하</div><h1 class="display">코일 출하소</h1><p>봉인을 열고 새로운 동료를 만나세요.</p></div>
    <div class="cast" aria-hidden="true">
      <img class="l" data-app2="ssial-1470M" alt=""><img class="r" data-app2="poo-PHS" alt=""><img class="c" data-app="front:" alt="">
    </div>
    <img class="coil" data-a="draw:coil-pack" alt="출하를 기다리는 코일">
    <div class="plate rates"><div class="in">
      <span><span class="s">★5</span><span class="num">5%</span></span>
      <span><span class="s">★4</span><span class="num">15%</span></span>
      <span><span class="s">★3</span><span class="num">35%</span></span>
      <span><span class="s">★2</span><span class="num">45%</span></span>
      <button>확률 안내</button></div></div>
    <div class="pulls">
      <button class="btn steel"><strong>1회 출하</strong><small>출하 1회 사용</small></button>
      <button class="btn brass"><strong>10연 출하</strong><small>스크랩 20 사용</small></button>
    </div>
  </section>

  <!-- 캐릭터 -->
  <section class="screen char" aria-label="동료 상세">
    <img class="bg" data-a="stage:star-5" id="charbg" alt=""><div class="tint"></div>
    <header class="hud"><button class="back" data-go="lobby">‹ 도감</button></header>
    <div class="hero"><img id="charimg" alt="도금이 1470H 전신"></div>
    <p class="ja" lang="ja" id="ja"></p>
    <div class="nameplate"><div class="stars">★★★★★<span class="rare">RARE</span></div><h1>도금이<b>1470H</b></h1>
      <div style="font-size:12px;font-weight:600">LV4 미래수요제품 · <span id="code"></span></div></div>
    <div class="plate sheet"><div class="in">
      <blockquote class="quote" id="quote"></blockquote>
      <div class="seg" role="group" aria-label="열처리 면"><button data-side="front" aria-pressed="true">프레스 전</button><button data-side="alt" aria-pressed="false">프레스 후</button></div>
      <div><div class="label" style="margin-bottom:6px">장착 장비</div><div class="slots" id="slots"></div></div>
      <div class="gauge">
        <b>인장강도 TS</b><div class="bar"><i id="tsbar"></i></div><span><span class="num" id="ts"></span> MPa</span>
        <b>연신율 EL</b><div class="bar"><i id="elbar"></i></div><span><span class="num" id="el"></span> %</span>
      </div>
      <p class="use" id="use"></p>
    </div></div>
  </section>

  <nav class="dock" aria-label="화면 선택" id="dock"><div class="plate"><div class="in"></div></div><div class="row">
    <button data-go="char"><img class="cardico" data-a="thumbnail:ga-1470H:front" alt="">도감</button>
    <button><img data-a="part:roof" alt=""><i class="dot" title="제작 가능"></i>제작</button>
    <button class="home" data-go="lobby" aria-current="page"><span><img data-a="draw:coil-pack" alt=""></span><em>공방</em></button>
    <button><img data-a="car:b" alt="">차고</button>
    <button><img data-a="item:loupe" alt="">연구</button>
  </div></nav>
</main>

<script type="module">
// 승인 목록(체험판 data.json)의 대상 ID로만 그림을 고른다. 파일을 복사하지 않는다.
const R = '../../../.omo/prototypes/steel-companion-full-art-remake/public/';
const d = await (await fetch(R + 'data.json')).json();
const CARD = 'ga-1470H';
const card = d.cards.find(c => c.id === CARD);
const look = (id, side, keys) => d.appearances.find(a => a.cardId === id && a.side === side && a.equipmentKeys.join() === keys.join());
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const stage = $('#stage');

for (const img of $$('[data-a]')) img.src = R + d.assets[img.dataset.a].image;
for (const img of $$('[data-app]')) img.src = R + look(CARD, 'front', []).image;
for (const img of $$('[data-app2]')) img.src = R + look(img.dataset.app2, 'front', []).image;
$('[data-t=ko]').textContent = d.dialogue.find(x => x.cardId === CARD && x.side === 'front').ko;
$('#code').textContent = card.code;
$('#use').textContent = card.use;

const motes = $('.motes');
for (let i = 0; i < 9; i++) {
  const m = document.createElement('i');
  m.style.left = (8 + i * 10.5) + '%'; m.style.top = (58 + (i * 37) % 30) + '%'; m.style.animationDelay = (-i * 0.8) + 's';
  motes.append(m);
}

// 캐릭터 화면: 면과 장비 슬롯이 승인 외형을 바꾼다
const KEYS = ['arrow', 'iron', 'spark'], NAMES = {arrow: '화살', iron: '다리미', spark: '스파크 건'};
const pick = {side: 'front', on: new Set(KEYS)};
const slots = $('#slots');
for (const k of KEYS) {
  const b = document.createElement('button');
  b.className = 'slot'; b.dataset.k = k; b.setAttribute('aria-label', NAMES[k]);
  const i = document.createElement('img'); i.src = R + d.assets['item:' + k].image; i.alt = '';
  b.append(i);
  b.addEventListener('click', () => { pick.on.has(k) ? pick.on.delete(k) : pick.on.add(k); paint(); });
  slots.append(b);
}
function paint() {
  const alt = pick.side === 'alt', spec = alt ? card.altSpec : card.spec;
  $('#charimg').src = R + look(CARD, pick.side, KEYS.filter(k => pick.on.has(k))).image;
  $('#charbg').src = R + d.assets[alt ? 'stage:heat-awakened' : 'stage:star-5'].image;
  const line = d.dialogue.find(x => x.cardId === CARD && x.side === pick.side);
  $('#quote').textContent = line.ko; $('#ja').textContent = line.ja;
  $('#ts').textContent = spec.ts; $('#el').textContent = spec.el;
  $('#tsbar').style.width = (alt ? 94 : 38) + '%'; $('#elbar').style.width = (alt ? 16 : 52) + '%';
  for (const b of $$('.slot')) b.setAttribute('aria-pressed', pick.on.has(b.dataset.k));
  for (const b of $$('[data-side]')) b.setAttribute('aria-pressed', b.dataset.side === pick.side);
}
for (const b of $$('[data-side]')) b.addEventListener('click', () => { pick.side = b.dataset.side; paint(); });
paint();

function show(screen) {
  stage.dataset.screen = screen;
  $('#dock').hidden = screen === 'char';
  for (const b of $$('#mockbar [data-screen]')) b.setAttribute('aria-pressed', b.dataset.screen === screen);
  sync();
}
function sync() { history.replaceState(null, '', '#' + stage.dataset.theme + '/' + stage.dataset.screen); }
for (const b of $$('[data-go]')) b.addEventListener('click', () => show(b.dataset.go));
for (const b of $$('#mockbar [data-screen]')) b.addEventListener('click', () => show(b.dataset.screen));
for (const b of $$('#mockbar [data-theme]')) b.addEventListener('click', () => {
  stage.dataset.theme = b.dataset.theme;
  for (const o of $$('#mockbar [data-theme]')) o.setAttribute('aria-pressed', o === b);
  sync();
});
const [t, s] = location.hash.slice(1).split('/');
if (['a', 'b', 'c'].includes(t)) $('#mockbar [data-theme=' + t + ']').click();
if (['lobby', 'ship', 'char'].includes(s)) show(s);
</script>
</body>
</html>
