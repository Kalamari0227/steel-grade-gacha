:root {

body {background:#c9cdd0;color:var(--ink);font:14px/1.5 var(--ko);word-break:keep-all;padding:0 0 48px}

.tile.un .lb {border-top-color:rgba(20,24,29,.2);color:var(--ink2)}

<body>
<div class="bar"><b>시안 · 게임 코드 아님.</b> 개념: <b>밝은 출하 검사장</b> — 철강 현장의 서류(코일 태그·검사증명서·작업지시서)를 화면 문법으로 쓰고, 밝은 검사장 조명 아래 금속 피규어를 세운다. 그림은 모두 승인 목록에서 불러오며 수치·보유 상태는 예시다. 독 아이콘은 SVG 자리 표시다.</div>

<div class="row">

<figure>
<section class="ph lobby">
  <img class="bgimg" data-a="scene:workshop:back" alt="">

  <div class="hud"><span class="mark"></span><span class="name">스틸 컴패니언</span><span class="sp"></span>

    <span class="snd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></span>
  </div>
  <div class="side micro">GA — GALVANNEALED · LV4</div>
  <img class="figure" data-ap="appearance:ga-1470H:front:none" alt="도금이 1470H 전신">
  <div class="say" data-say></div>
  <div class="plate">
    <div class="micro">FEATURED · 로비 대표</div>

  </div>

    <img data-a="part:hood" alt="">
    <div><div class="micro">NEXT · 다음 제작 목표</div><b>후드</b><span class="st">● 지금 제작 가능</span></div>

</section>
<figcaption><b>① 로비</b>밝은 공방 원경 그대로. 강종 번호를 가장 큰 글자로 세우고, 계열색(자주)을 이름판의 띠로 쓴다. 노랑은 "코일 출하" 한 곳뿐이다.</figcaption>
</figure>

<figure>
<section class="ph ship">
  <div class="hud"><span class="mark"></span><span class="sp"></span>
    <span class="chip"><span class="micro">COIL</span><b class="num">1</b></span>
    <span class="chip"><span class="micro">SCRAP</span><b class="num">24</b></span></div>
  <div class="head"><div class="micro">01 — SHIPMENT · 정기 출하</div><h2>코일 출하소</h2></div>
  <div class="floor"></div>
  <img class="coil" data-a="draw:coil-pack" alt="봉인된 코일">
  <div class="ctag"><span class="micro">COIL TAG</span><b>LOT 2611-15</b><span>동료 1명 봉입</span></div>
  <div class="rates">
    <div><span class="stars">★5</span><b class="num">5<small>%</small></b></div>
    <div><span class="stars">★4</span><b class="num">15<small>%</small></b></div>
    <div><span class="stars">★3</span><b class="num">35<small>%</small></b></div>
    <div><span class="stars">★2</span><b class="num">45<small>%</small></b></div>
  </div>
  <div class="acts">
    <button class="cta cut"><span class="hz"></span><span class="t"><b>1회 출하</b><span>기본 출하 사용</span></span><span class="n"><span class="micro" style="color:var(--ink)">남은 출하</span><b class="num">1</b></span></button>
    <div class="two"><button class="ghost"><b>10연 출하</b><span>스크랩 20</span></button><button class="ghost"><b>LV3 · LV4 확정 교환</b><span>스크랩 5 · 10</span></button></div>
    <p class="note">기본 출하는 24시간에 한 번 · 추가 출하 0회 보유</p>

  <nav class="dock" data-on="0"></nav>

<figcaption><b>② 출하소</b>코일에 태그를 달고, 확률은 규격표처럼 적는다. 봉인을 여는 순간부터는 지금의 어두운 연출로 넘어간다(밝은 화면에서 암전되므로 대비가 더 커진다).</figcaption>
</figure>

<figure>
<section class="ph index">
  <div class="hud"><span class="mark"></span><span class="sp"></span>
    <span class="chip"><span class="micro">COIL</span><b class="num">1</b></span>
    <span class="chip"><span class="micro">SCRAP</span><b class="num">24</b></span></div>
  <div class="head"><div class="micro">02 — INDEX · 강종 대장</div><h2>동료 도감</h2>
    <div class="count"><div class="micro">DISCOVERED</div><b class="num" id="disc"></b></div></div>
  <div class="tabs" id="tabs"></div>

<figure>
<section class="ph cert">
  <div class="top"><div><div class="micro">INSPECTION CERTIFICATE</div><b style="font:900 15px/1.3 var(--ko)">검사증명서</b></div><span class="x">×</span></div>
  <div class="bay">
    <div class="card"><img class="sg" data-a="stage:star-5" alt=""><img class="ch" data-ap="appearance:ga-1470H:front:none" alt="도금이 1470H"><img class="fr" data-a="frame:star-5" alt=""></div>
    <div class="id">
      <div class="fl"><i class="fam" style="--c:var(--ga)"></i>GA · 합금화용융아연도금</div>
      <b class="num">1470H</b>
      <h3>도금이 1470H</h3>
      <div class="stars">★★★★★ <i class="tag" style="color:var(--ink)">RARE</i></div>
      <dl><dt>사업 등급</dt><dd>LV4 미래수요제품</dd><dt>규격</dt><dd id="code"></dd><dt>재고</dt><dd>2장</dd></dl>
    </div>
    <div class="seg"><span class="on">열처리 전</span><span>열처리 후</span></div>
    <div class="seal">검사<br>합격<small>2026.11.15</small></div>
  </div>
  <div class="sheet">
    <div class="micro">MECHANICAL PROPERTIES · 소재 물성</div>
    <table class="spec" id="spec"></table>
    <div class="quote" id="quote"></div>
    <div class="micro" style="margin-top:12px">EQUIPMENT · 장착 외형 미리보기</div>
    <div class="slots" id="slots"></div>
    <button class="set">로비 대표로 지정</button>
  </div>

<figcaption><b>④ 상세 = 검사증명서</b>카드는 승인 구성(무대·전신·프레임) 그대로 두고, 정보는 실제 물성표처럼 읽힌다. 계열색이 게이지와 인용선에 들어간다. 빨간 도장은 "발견함"의 표시다.</figcaption>
</figure>

<figure>
<section class="ph craft">
  <div class="hud"><span class="mark"></span><span class="sp"></span>
    <span class="chip"><span class="micro">COIL</span><b class="num">1</b></span>
    <span class="chip"><span class="micro">SCRAP</span><b class="num">24</b></span></div>
  <div class="head"><div class="micro">03 — WORK ORDER · 작업지시</div><h2>제작</h2>
    <div class="count"><div class="micro">PARTS</div><b class="num">12<small>/35</small></b></div>
    <div class="meter" id="meter"></div></div>
  <div class="ready"><div class="micro" style="margin-bottom:6px">READY · 지금 제작 가능 2</div><div id="ready"></div></div>
  <div class="grp" id="grp"></div>
  <nav class="dock" data-on="2"></nav>
</section>
<figcaption><b>⑤ 제작 = 작업지시서</b>지금 만들 수 있는 부품이 맨 위에 고정된다. 나머지는 묶음별 줄 목록이고, 완성한 것은 흐리게 물러난다. 35칸 눈금이 전체 진행을 보여 준다.</figcaption>
</figure>

</div>

<script type="module">
const R = '../../../.omo/prototypes/steel-companion-full-art-remake/public/';
const d = await (await fetch(R + 'data.json')).json();
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
for (const i of $$('[data-a]')) i.src = R + d.assets[i.dataset.a].image;
for (const i of $$('[data-ap]')) i.src = R + d.appearances.find(a => a.id === i.dataset.ap).image;

// 독: 선 아이콘 한 벌 (자리 표시)
const ICON = [
  ['공방', 'LOBBY', '<path d="M3 20V11l6 3.5V11l6 3.5V5h6v15z"/><path d="M7 20v-3M12 20v-3M17 20v-3"/>'],
  ['도감', 'INDEX', '<rect x="4" y="3" width="7" height="8"/><rect x="13" y="3" width="7" height="8"/><rect x="4" y="13" width="7" height="8"/><rect x="13" y="13" width="7" height="8"/>'],
  ['제작', 'CRAFT', '<path d="M13 4l7 7-3 3-7-7z"/><path d="M11.5 8.5L3 17l4 4 8.5-8.5"/>'],
  ['차고', 'GARAGE', '<path d="M3 17v-4l2-5h14l2 5v4"/><path d="M3 13h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>'],
  ['연구', 'LAB', '<path d="M9 3h6M10 3v6L5 19a1.4 1.4 0 001.3 2h11.4A1.4 1.4 0 0019 19L14 9V3"/><path d="M7.5 15h9"/>']
];
for (const nav of $$('.dock')) ICON.forEach(([ko, en, p], i) => {
  const a = el('a', (i == nav.dataset.on ? 'on ' : '') + (i == 4 ? 'lock ' : '') + (i == 2 && nav.dataset.on != 2 ? 'dot' : ''), `<svg viewBox="0 0 24 24">${p}</svg><b>${ko}</b><i>${i == 4 ? 'LOCKED' : en}</i>`);
  nav.append(a);
});

// 로비·상세의 승인 대사와 물성
const card = d.cards.find(c => c.id === 'ga-1470H');
const line = d.dialogue.find(x => x.cardId === 'ga-1470H' && x.side === 'front');
$('[data-say]').textContent = line.ko;
$('#quote').innerHTML = `${line.ko}<small>${line.ja}</small>`;
$('#code').textContent = card.code;
const rows = [['인장강도 TS', card.spec.ts, 'MPa', 1500]];
if (card.spec.el) rows.push(['연신율 EL', card.spec.el, '%', 50]);
if (card.spec.ra) rows.push(['단면수축률 RA', card.spec.ra, '%', 80]);
for (const [k, v, u, max] of rows) {
  const n = parseFloat(v), rest = String(v).replace(/^[\d.]+\s*/, '');
  $('#spec').append(el('tr', '', `<td>${k}</td><td><div class="bar2"><i style="width:${Math.min(100, n / max * 100)}%"></i></div></td><td class="v"><b class="num">${n}</b> ${rest} ${u}</td>`));
}
$('#spec').append(el('tr', '', `<td>주요 용도</td><td colspan="2" style="font-weight:700;padding-left:10px">${card.use}</td>`));
[['arrow', '화살', 1], ['dagger', '단검', 0], ['potion', '포션', 1], ['shield', '방패', 0]].forEach(([k, n, on]) =>
  $('#slots').append(el('div', 'slot' + (on ? ' on' : ''), `<img src="${R + d.assets['item:' + k].image}" alt="">${n}`)));

// 도감: 계열별 대장. 발견 여부는 예시.
const KNOWN = new Set(['ga-1470H', 'ga-270C', 'ga-270D', 'ga-340H', 'ga-590Y', 'ga-980Y', 'ga-SEDDQ', 'ssial-270C', 'ssial-270D', 'ssial-1470M', 'poo-270C', 'poo-PHS', 'eg-SECC']);
const general = d.cards.filter(c => c.family !== 'qp');
$('#disc').innerHTML = `${general.filter(c => KNOWN.has(c.id)).length}<small>/${general.length}</small>`;
const fams = d.families.filter(f => f.key !== 'qp');
$('#tabs').append(el('span', 'on', `전체 <b class="num">${general.length}</b>`));
for (const f of fams) $('#tabs').append(el('span', '', `${f.name} <b class="num">${general.filter(c => c.family === f.key && KNOWN.has(c.id)).length}/${general.filter(c => c.family === f.key).length}</b>`));
const color = { poo: 'po', ssial: 'cr', ga: 'ga', eg: 'eg', tarae: 'wr' };
for (const f of [fams.find(x => x.key === 'ga'), fams.find(x => x.key === 'ssial')]) {
  const list = general.filter(c => c.family === f.key);
  $('#reg').append(el('div', 'sec', `<i class="fam" style="--c:var(--${color[f.key]})"></i><b>${f.name}</b><span class="micro">${f.abbr} · ${f.kind}</span><b class="num">${list.filter(c => KNOWN.has(c.id)).length}/${list.length}</b>`));
  const g = el('div', 'grid');
  for (const c of list) {
    const known = KNOWN.has(c.id), star = c.level + 1;
    const t = el('div', 'tile ' + (known ? 's' + star : 'un'));
    t.innerHTML = known
      ? `<div class="th"><img src="${R + d.assets['thumbnail:' + c.id + ':front'].image}" alt="">${c.rare ? '<span class="rr">RARE</span>' : ''}</div><div class="lb"><b class="num">${c.grade}</b><span class="stars">${'★'.repeat(star)}</span></div>`
      : `<div class="th"><img src="${R + d.assets['silhouette:' + f.key].image}" alt=""></div><div class="lb"><b class="num">···</b><span class="micro" style="font-size:8px">미등록</span></div>`;
    g.append(t);
  }
  $('#reg').append(g);
}

// 제작: 눈금과 작업지시. 완성·가능 상태는 예시.
for (let i = 0; i < 35; i++) $('#meter').append(el('i', i < 12 ? 'f' : i < 14 ? 'r' : ''));
const P = d.parts, name = id => { const c = d.cards.find(x => x.id === id); return c ? `${c.familyName} ${c.grade}` : id; };
for (const p of [P.find(x => x.key === 'hood'), P.find(x => x.key === 'fender')].filter(Boolean))
  $('#ready').append(el('div', 'wo', `<img src="${R + d.assets['part:' + p.key].image}" alt=""><div><span class="micro">NO. ${String(p.no).padStart(2, '0')} · ${p.grp}</span><b>${p.name}</b><span class="need">${p.need.map(n => n.n).join(' + ')}</span></div><span class="mk cut">제작</span>`));
const groups = [...new Set(P.map(p => p.grp))];
groups.forEach((gname, gi) => {
  const list = P.filter(p => p.grp === gname);
  const done = gi === 0 ? 6 : gi === 1 ? 4 : 2;
  $('#grp').append(el('div', 'gh', `<b>${gname}</b><b class="num">${done}/${list.length}</b>`));
  if (gi === 0) list.slice(0, 6).forEach((p, i) => {
    const st = i < 4 ? ['d', '✓ 완성'] : i === 4 ? ['r', '제작 가능'] : ['x', '소재 부족'];
    $('#grp').append(el('div', 'pl' + (i < 4 ? ' dn' : ''), `<span class="num">${String(p.no).padStart(2, '0')}</span><b>${p.name}</b><span class="s ${st[0]}">${st[1]}</span>`));
  });
});
</script>
</body>
</html>
